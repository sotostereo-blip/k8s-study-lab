# The certifications the app offers, in the order shown in the selector.
# exam  = multiple-choice question bank (content/<exam>/exam.yaml)
# track = hands-on labs (content/<track>/labs.yaml)
certifications:
  - id: kcna
    name: Kubernetes and Cloud Native Associate
    short: KCNA
    area: Kubernetes
    exam: kcna
    description: Multiple choice. Kubernetes and cloud native basics.
  - id: kcsa
    name: Kubernetes and Cloud Native Security Associate
    short: KCSA
    area: Kubernetes
    exam: kcsa
    description: Multiple choice. Security of Kubernetes and the cloud native platform.
  - id: cka
    name: Certified Kubernetes Administrator
    short: CKA
    area: Kubernetes
    track: cka
    description: Hands-on. Run and fix a real cluster from the command line.
  - id: ckad
    name: Certified Kubernetes Application Developer
    short: CKAD
    area: Kubernetes
    track: ckad
    description: Hands-on. Build, deploy, configure and debug applications on Kubernetes.
  - id: cks
    name: Certified Kubernetes Security Specialist
    short: CKS
    area: Kubernetes
    track: cks
    description: Hands-on. Secure a cluster and its workloads (requires a passed CKA for the real exam).
  - id: terraform
    name: HashiCorp Certified Terraform Associate (004)
    short: Terraform
    area: Infrastructure as Code
    exam: terraform
    track: terraform
    description: Multiple choice exam, plus hands-on labs with Terraform and a local AWS emulator.
  - id: lfcs
    name: Linux Foundation Certified System Administrator
    short: LFCS
    area: Linux and containers
    exam: lfcs
    track: lfcs
    description: Hands-on Linux administration on Ubuntu servers with systemd (labs and mock exam), plus a concept question bank.
  - id: dca
    name: Docker Certified Associate
    short: DCA
    area: Linux and containers
    exam: dca
    track: dca
    description: Multiple choice exam (Mirantis), plus hands-on labs on a real Docker Engine with Swarm, Compose and a local registry.
  - id: gha
    name: GitHub Actions (GH-200)
    short: GH-200
    area: CI/CD and GitOps
    exam: gha
    track: gha
    description: Multiple choice (Microsoft/GitHub), plus hands-on labs on Gitea Actions, which runs the same workflow syntax.
  - id: capa
    name: Certified Argo Project Associate
    short: CAPA
    area: CI/CD and GitOps
    exam: capa
    track: capa
    description: Multiple choice. Argo Workflows, Argo CD, Argo Rollouts and Argo Events, plus hands-on labs on a cluster with Argo and a Git server.
  - id: pca
    name: Prometheus Certified Associate
    short: PCA
    area: Observability
    exam: pca
    track: pca
    description: Multiple choice. PromQL, scraping, instrumentation, alerting and observability concepts, plus hands-on labs on a real Prometheus stack.
  - id: interview
    name: DevOps and Cloud Engineer job interviews (in English)
    short: Interviews
    area: Career
    interview: true
    description: Answer real interview questions aloud in English, check the key points, and run timed mock interviews.
