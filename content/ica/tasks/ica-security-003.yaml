id: ica-security-003
title: Serve HTTPS on the ingress gateway
domain: securing-workloads
difficulty: 2
minutes: 10
environment: istio
setup: |
  lab-app ns secure inject
  lab-app echo secure portal v1 "portal v1"
  lab-app wait secure
  mkdir -p /root/tls && cd /root/tls
  openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=Lab CA" -keyout ca.key -out ca.crt 2>/dev/null
  openssl req -newkey rsa:2048 -nodes -subj "/CN=portal.lab" -keyout tls.key -out tls.csr 2>/dev/null
  printf 'subjectAltName=DNS:portal.lab\n' > san.ext
  openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 -extfile san.ext -out tls.crt 2>/dev/null
  rm -f tls.csr san.ext ca.srl
task: |
  The Service `portal` (port 80) runs in the namespace `secure`. Publish it with **HTTPS** on the
  ingress gateway for the host `portal.lab`. A certificate and key for `portal.lab` are in
  `/root/tls/tls.crt` and `/root/tls/tls.key` (signed by the CA in `/root/tls/ca.crt`).

  1. Store the certificate in a TLS Secret called `portal-cert` in the namespace where the
     ingress gateway runs (`istio-system`).
  2. Create a `Gateway` called `portal-gateway` (namespace `secure`) with an HTTPS server on
     port 443 for `portal.lab`, TLS mode `SIMPLE`, using that Secret.
  3. Create a `VirtualService` that sends that traffic to `portal`.

  Test: `curl --cacert /root/tls/ca.crt --resolve portal.lab:30443:$(getent hosts server | cut -d' ' -f1) https://portal.lab:30443/`
checks:
  - name: Secret `portal-cert` (type kubernetes.io/tls) exists in istio-system
    run: '[ "$(kubectl -n istio-system get secret portal-cert -o jsonpath="{.type}")" = kubernetes.io/tls ]'
  - name: https://portal.lab:30443/ answers with the portal app and the lab certificate
    run: |
      ip=$(getent hosts server | cut -d' ' -f1) &&
      [ "$(curl -s --max-time 5 --cacert /root/tls/ca.crt --resolve "portal.lab:30443:$ip" https://portal.lab:30443/)" = "portal v1" ]
solution: |
  kubectl -n istio-system create secret tls portal-cert --cert=/root/tls/tls.crt --key=/root/tls/tls.key
  kubectl apply -n secure -f - <<'YAML'
  apiVersion: networking.istio.io/v1
  kind: Gateway
  metadata:
    name: portal-gateway
  spec:
    selector:
      istio: ingressgateway
    servers:
      - port: { number: 443, name: https, protocol: HTTPS }
        hosts: ["portal.lab"]
        tls:
          mode: SIMPLE
          credentialName: portal-cert
  ---
  apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: portal
  spec:
    hosts: ["portal.lab"]
    gateways: ["portal-gateway"]
    http:
      - route:
          - destination: { host: portal, port: { number: 80 } }
  YAML
  # credentialName is read from the gateway's own namespace (istio-system here).
docs:
  - https://istio.io/latest/docs/tasks/traffic-management/ingress/secure-ingress/
  - https://istio.io/latest/docs/reference/config/networking/gateway/
