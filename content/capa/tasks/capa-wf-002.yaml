id: capa-wf-002
title: Build a DAG workflow
domain: argo-workflows
difficulty: 2
minutes: 8
environment: argocd
setup: |
  kubectl create namespace wf-dag >/dev/null
task: |
  Create a Workflow called exactly `diamond` (not `generateName`) in the namespace `wf-dag`.
  Its entrypoint is a **DAG** template with four tasks, `A`, `B`, `C` and `D`. Each task runs a
  container (`busybox:1.36`) that prints its name.

  - `B` and `C` depend on `A` (they run in parallel after `A`)
  - `D` depends on both `B` and `C`

  The Workflow must finish with phase `Succeeded`.
checks:
  - name: Workflow `diamond` Succeeded
    run: '[ "$(kubectl -n wf-dag get workflow diamond -o jsonpath="{.status.phase}")" = Succeeded ]'
  - name: The DAG has the right dependencies (B, C after A; D after B and C)
    run: |
      deps() {   # dependencies of a DAG task, from `dependencies` or `depends`
        kubectl -n wf-dag get workflow diamond -o json | jq -r --arg t "$1" '
          [.spec.templates[].dag.tasks[]? | select(.name == $t)][0]
          | ((.dependencies // []) + ((.depends // "") | [scan("[A-Za-z0-9_-]+")] | map(select(. != "Succeeded" and . != "Failed" and . != "Errored" and . != "Skipped" and . != "Daemoned"))))
          | unique | join(",")'
      }
      [ "$(deps A)" = "" ] && [ "$(deps B)" = A ] && [ "$(deps C)" = A ] && [ "$(deps D)" = B,C ]
  - name: Four task Pods ran (A, B, C and D) and succeeded
    run: |
      [ "$(kubectl -n wf-dag get workflow diamond -o json | jq '[.status.nodes[] | select(.type == "Pod" and .phase == "Succeeded")] | length')" = 4 ]
solution: |
  kubectl create -n wf-dag -f - <<'YAML'
  apiVersion: argoproj.io/v1alpha1
  kind: Workflow
  metadata:
    name: diamond
  spec:
    entrypoint: main
    templates:
    - name: main
      dag:
        tasks:
        - { name: A, template: echo, arguments: { parameters: [{ name: msg, value: A }] } }
        - { name: B, template: echo, dependencies: [A], arguments: { parameters: [{ name: msg, value: B }] } }
        - { name: C, template: echo, dependencies: [A], arguments: { parameters: [{ name: msg, value: C }] } }
        - { name: D, template: echo, dependencies: [B, C], arguments: { parameters: [{ name: msg, value: D }] } }
    - name: echo
      inputs: { parameters: [{ name: msg }] }
      container: { image: "busybox:1.36", command: [echo, "{{inputs.parameters.msg}}"] }
  YAML
  argo watch -n wf-dag diamond      # or: argo get -n wf-dag diamond
docs:
  - https://argo-workflows.readthedocs.io/en/latest/walk-through/dag/
  - https://argo-workflows.readthedocs.io/en/latest/enhanced-depends-logic/
