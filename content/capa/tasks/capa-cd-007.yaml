id: capa-cd-007
title: Order a sync with sync waves and a PreSync hook
domain: argo-cd
difficulty: 3
minutes: 10
environment: argocd
setup: |
  set -e
  d=$(mktemp -d); mkdir -p $d/app
  cat > $d/app/configmap.yaml <<'YAML'
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: waves-config
  data:
    GREETING: hello
  YAML
  cat > $d/app/deployment.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: waves-web
  spec:
    replicas: 1
    selector: { matchLabels: { app: waves-web } }
    template:
      metadata: { labels: { app: waves-web } }
      spec:
        containers:
        - name: nginx
          image: nginx:1.27-alpine
          envFrom: [{ configMapRef: { name: waves-config } }]
  YAML
  lab-repo cd-waves $d >/dev/null
  argocd app create cd-waves --repo http://git.lab/cd-waves.git --path app \
    --dest-server https://kubernetes.default.svc --dest-namespace cd-waves --sync-option CreateNamespace=true >/dev/null
task: |
  The Application `cd-waves` (repository `http://git.lab/cd-waves.git`, path `app`) was never
  synced. Before the first sync, change the manifests **in Git** so that Argo CD:

  1. applies the ConfigMap `waves-config` in sync wave `-1`,
  2. applies the Deployment `waves-web` in sync wave `1`,
  3. runs a new Job `waves-migrate` (image `busybox:1.36`, command `echo migrate`) as a
     **PreSync** hook. Keep the Job after it finishes (use the delete policy `BeforeHookCreation`).

  Then sync `cd-waves`. It must end `Synced` and `Healthy`.
checks:
  - name: ConfigMap `waves-config` is in sync wave -1 and Deployment `waves-web` in wave 1
    run: |
      [ "$(kubectl -n cd-waves get configmap waves-config -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/sync-wave}')" = "-1" ] &&
      [ "$(kubectl -n cd-waves get deploy waves-web -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/sync-wave}')" = "1" ]
  - name: Job `waves-migrate` is a PreSync hook and completed
    run: |
      [ "$(kubectl -n cd-waves get job waves-migrate -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/hook}/{.status.succeeded}')" = PreSync/1 ]
  - name: Application `cd-waves` is Synced and Healthy
    run: |
      [ "$(kubectl -n argocd get app cd-waves -o jsonpath='{.status.sync.status}/{.status.health.status}')" = Synced/Healthy ]
solution: |
  git clone http://git.lab/cd-waves.git && cd cd-waves
  # 1. and 2. add under metadata of each object:
  #   annotations: { argocd.argoproj.io/sync-wave: "-1" }   (ConfigMap)
  #   annotations: { argocd.argoproj.io/sync-wave: "1" }    (Deployment)
  # 3. a new file app/migrate-job.yaml:
  cat > app/migrate-job.yaml <<'YAML'
  apiVersion: batch/v1
  kind: Job
  metadata:
    name: waves-migrate
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  spec:
    template:
      spec:
        restartPolicy: Never
        containers: [{ name: migrate, image: "busybox:1.36", command: [echo, migrate] }]
  YAML
  git add -A && git commit -m "Add sync waves and a PreSync hook" && git push
  argocd app sync cd-waves
docs:
  - https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
  - https://argo-cd.readthedocs.io/en/stable/user-guide/resource_hooks/
auto_solution: |
  set -e
  cd $(mktemp -d) && git clone -q http://git.lab/cd-waves.git && cd cd-waves
  sed -i 's/^  name: waves-config$/  name: waves-config\n  annotations: { argocd.argoproj.io\/sync-wave: "-1" }/' app/configmap.yaml
  sed -i 's/^  name: waves-web$/  name: waves-web\n  annotations: { argocd.argoproj.io\/sync-wave: "1" }/' app/deployment.yaml
  cat > app/migrate-job.yaml <<'YAML'
  apiVersion: batch/v1
  kind: Job
  metadata:
    name: waves-migrate
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  spec:
    template:
      spec:
        restartPolicy: Never
        containers: [{ name: migrate, image: "busybox:1.36", command: [echo, migrate] }]
  YAML
  git add -A && git commit -qm "Add sync waves and a PreSync hook" && git push -q
  argocd app sync cd-waves --timeout 150
