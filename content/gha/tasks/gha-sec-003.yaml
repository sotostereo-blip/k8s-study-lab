id: gha-sec-003
title: Pin actions to a commit SHA and limit the token
domain: security
difficulty: 2
minutes: 10
environment: gitea
setup: |
  mkdir -p /root/pinned-actions/.github/workflows && cd /root/pinned-actions
  echo "Pinned actions demo" > README.md
  cat > .github/workflows/ci.yml <<'YAML'
  name: CI
  on: push
  jobs:
    show:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: cat README.md
  YAML
  lab-publish /root/pinned-actions "Add CI"
task: |
  Harden `.github/workflows/ci.yml` in `student/pinned-actions`:

  1. Pin `actions/checkout` to the **full commit SHA** of its release `v4.2.2`, and keep the
     version in a comment (`# v4.2.2`). Find the SHA with
     `git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2`.
  2. Give the workflow token only **read access to the repository contents** with a
     top-level `permissions` block.

  Push it. The run for your commit must succeed (it prints `Pinned actions demo`).

  *Gitea vs GitHub:* the runner downloads `actions/checkout` from github.com in both cases,
  so the SHA is the same. On GitHub, `permissions` limits `GITHUB_TOKEN`; Gitea applies it to
  its own token (`GITEA_TOKEN`, also available as `GITHUB_TOKEN`) and may ignore some scopes.
checks:
  - name: 'Every non-local `uses:` is pinned to a 40-character commit SHA'
    run: |
      wf=$(lab-file pinned-actions .github/workflows/ci.yml) || exit 1
      uses=$(echo "$wf" | yq '.jobs[].steps[].uses // ""' | grep -v '^$' | grep -v '^\./') || exit 1
      [ -n "$uses" ] && ! echo "$uses" | grep -Evq '@[0-9a-f]{40}$'
  - name: '`actions/checkout` is pinned to the commit of `v4.2.2`'
    run: lab-file pinned-actions .github/workflows/ci.yml | grep -q 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
  - name: 'The workflow sets `permissions` with `contents: read`'
    run: lab-file pinned-actions .github/workflows/ci.yml | yq -e '.permissions.contents == "read" or .permissions == "read-all"' >/dev/null
  - name: 'The newest commit pins `actions/checkout`, and its push run succeeded and printed the README'
    run: |
      lab-file pinned-actions .github/workflows/ci.yml | grep -q 'actions/checkout@[0-9a-f]\{40\}' || exit 1
      id=$(lab-ok pinned-actions ".head_sha==\"$(lab-head pinned-actions)\" and .event==\"push\"") || exit 1
      lab-has-line pinned-actions "$id" "Pinned actions demo"
solution: |
  git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
  # 11bd71901bbe5b1630ceea73d27597364c9af683	refs/tags/v4.2.2
  cd /root/pinned-actions
  cat > .github/workflows/ci.yml <<'YAML'
  name: CI
  on: push
  permissions:
    contents: read
  jobs:
    show:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        - run: cat README.md
  YAML
  git commit -am "Pin actions and limit the token"
  git push
  lab-wait pinned-actions ".head_sha==\"$(git rev-parse HEAD)\""
docs:
  - https://docs.github.com/en/actions/reference/security/secure-use
  - https://docs.github.com/en/actions/concepts/security/github_token
  - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
