id: gha-ts-002
title: The workflow never runs its job
domain: consume
difficulty: 2
minutes: 8
environment: gitea
setup: |
  mkdir -p /root/no-trigger/.github/workflows && cd /root/no-trigger
  echo "# no-trigger" > README.md
  cat > .github/workflows/lint.yml <<'YAML'
  name: Lint
  on:
    push:
      branches: [master]
  jobs:
    lint:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: test -f README.md && echo "Lint passed"
  YAML
  lab-publish /root/no-trigger "Add lint workflow"
task: |
  In `student/no-trigger` (cloned in `/root/no-trigger`), the workflow `Lint` should check the
  code on **every push to `main`**. But nothing happens when people push. There are **two**
  reasons, both about events and conditions.

  Fix the workflow so that a push to `main` runs the `lint` job. The run for your commit must
  succeed and print `Lint passed`.

  *Gitea vs GitHub:* events, branch filters and `if:` conditions work the same way here.
  Use `lab-runs no-trigger | jq '.[] | {id, event, status, conclusion}'` to see what ran.
checks:
  - name: 'A push run for the newest commit on `main` succeeded'
    run: lab-ok no-trigger ".head_sha==\"$(lab-head no-trigger)\" and .event==\"push\"" >/dev/null
  - name: 'The `lint` job ran and printed `Lint passed`'
    run: |
      id=$(lab-ok no-trigger ".head_sha==\"$(lab-head no-trigger)\" and .event==\"push\"") || exit 1
      lab-has-line no-trigger "$id" "Lint passed"
solution: |
  cd /root/no-trigger
  # 1. The branch filter says `master`, but the branch is `main`.
  # 2. The job condition only allows `pull_request` events, so on push the job is skipped.
  cat > .github/workflows/lint.yml <<'YAML'
  name: Lint
  on:
    push:
      branches: [main]
  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: test -f README.md && echo "Lint passed"
  YAML
  git commit -am "Run lint on push to main"
  git push
  lab-wait no-trigger ".head_sha==\"$(git rev-parse HEAD)\""
docs:
  - https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  - https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
