id: pca-fund-002
title: Fix a broken scrape job and install it
domain: fundamentals
difficulty: 2
minutes: 8
environment: prometheus
setup: |
  mkdir -p /lab/prometheus/drafts
  cat > /lab/prometheus/drafts/legacy.yml <<'YAML'
  # Draft from a colleague - Prometheus does not accept it yet.
  scrape_configs:
    - job_name: legacy
      scrape_interval: 15
      metrics_path: /metrics
      static_config:
        - targets: ["http://inventory:8000"]
          labels:
            tier: backend
  YAML
task: |
  A colleague wrote a scrape job in `/lab/prometheus/drafts/legacy.yml`. It is not loaded yet,
  and it has **three** mistakes.

  1. Fix the file. The job must scrape `inventory:8000` every **15 seconds** and add the
     label `tier="backend"` to the target.
  2. Copy the fixed file to `/lab/prometheus/scrape.d/legacy.yml`.
  3. Run `promtool check config /lab/prometheus/prometheus.yml` (it also checks the files of
     `scrape_config_files`) and reload Prometheus.

  Tip: a broken file in `scrape.d/` makes the reload fail, and Prometheus keeps the old
  configuration. `prometheus_config_last_reload_successful` tells you if the last reload worked.
checks:
  - name: 'The job `legacy` scrapes `inventory:8000` every 15s with label tier="backend", and it is up'
    run: |
      out=$(curl -sf http://prometheus:9090/api/v1/targets)
      echo "$out" | jq -e '[.data.activeTargets[] | select(.labels.job == "legacy")]
        | length == 1 and .[0].labels.instance == "inventory:8000" and .[0].labels.tier == "backend"
          and .[0].scrapeInterval == "15s" and .[0].health == "up"' >/dev/null
  - name: The main configuration is valid (promtool check config)
    run: promtool check config /lab/prometheus/prometheus.yml >/dev/null 2>&1
    guard: true
  - name: The last reload of Prometheus was successful
    run: promq 'prometheus_config_last_reload_successful == 1' | jq -e 'length == 1' >/dev/null
    guard: true
solution: |
  # The three mistakes: 15 has no unit (15s), static_config must be static_configs,
  # and a target is host:port without the scheme (use `scheme: https` for HTTPS).
  cat > /lab/prometheus/scrape.d/legacy.yml <<'YAML'
  scrape_configs:
    - job_name: legacy
      scrape_interval: 15s
      metrics_path: /metrics
      static_configs:
        - targets: ["inventory:8000"]
          labels:
            tier: backend
  YAML
  promtool check config /lab/prometheus/prometheus.yml
  curl -X POST http://prometheus:9090/-/reload
docs:
  - https://prometheus.io/docs/prometheus/latest/configuration/configuration/
  - https://prometheus.io/docs/prometheus/latest/command-line/promtool/
