# AWS glossary (AWS Certified Solutions Architect - Associate). Shown when you click a highlighted term.
# Reuses kms, tls, encryption-at-rest, audit-log from other glossary files.
terms:
- id: aws-iam
  term: AWS Identity and Access Management (IAM)
  match:
  - IAM
  - AWS IAM
  - Identity and Access Management
  definition: The AWS service that controls who can sign in and what each user, role or service may do in an account.
  es: Servicio de AWS que controla quién entra y qué puede hacer cada usuario, rol o servicio.
- id: aws-iam-user
  term: IAM user
  match:
  - IAM user
  - IAM users
  definition: An identity for one person or application with long-term credentials (password or access keys).
  es: Identidad de IAM para una persona o aplicación con credenciales de larga duración.
- id: aws-iam-role
  term: IAM role
  match:
  - IAM role
  - IAM roles
  - instance profile
  - instance profiles
  definition: An IAM identity with permissions that a user, service or application assumes to get temporary credentials. It has no password or long-term keys.
  es: Identidad de IAM que se asume para obtener credenciales temporales; no tiene contraseña ni claves fijas.
- id: aws-iam-policy
  term: IAM policy
  match:
  - IAM policy
  - IAM policies
  - identity-based policy
  - identity-based policies
  - policy document
  - resource-based policy
  - resource-based policies
  definition: A JSON document with Allow or Deny statements (actions, resources, conditions). An explicit Deny always wins.
  es: Documento JSON con sentencias Allow o Deny; un Deny explícito siempre gana.
- id: aws-sts
  term: AWS Security Token Service (STS)
  match:
  - AWS STS
  - STS
  - temporary credentials
  - AssumeRole
  definition: The AWS service that issues short-lived credentials, for example when someone assumes an IAM role.
  es: Servicio que emite credenciales temporales, por ejemplo al asumir un rol.
- id: aws-mfa
  term: Multi-factor authentication (MFA)
  match:
  - MFA
  - multi-factor authentication
  definition: Sign-in that needs a second proof, such as a code from a device, in addition to the password.
  es: 'Autenticación multifactor: una segunda prueba además de la contraseña.'
- id: aws-organizations
  term: AWS Organizations
  match:
  - AWS Organizations
  - organizational unit
  - organizational units
  - OU
  - OUs
  definition: A service to manage many AWS accounts together, group them in organizational units and apply policies to them.
  es: Servicio para gestionar muchas cuentas de AWS juntas y aplicarles políticas.
- id: aws-scp
  term: Service control policy (SCP)
  match:
  - service control policy
  - service control policies
  - SCP
  - SCPs
  definition: An AWS Organizations policy that sets the maximum permissions for accounts. It never grants permissions by itself.
  es: Política de Organizations que limita los permisos máximos de las cuentas; no concede permisos.
- id: aws-identity-center
  term: AWS IAM Identity Center
  match:
  - IAM Identity Center
  - permission set
  - permission sets
  definition: The AWS service for single sign-on of workforce users to many AWS accounts and applications.
  es: Servicio de inicio de sesión único para los empleados en muchas cuentas y aplicaciones.
- id: aws-cognito
  term: Amazon Cognito
  match:
  - Cognito
  - Amazon Cognito
  - user pool
  - user pools
  - identity pool
  - identity pools
  definition: A service that adds sign-up, sign-in and access control for users of web and mobile apps.
  es: Servicio que añade registro e inicio de sesión de usuarios a aplicaciones web y móviles.
- id: aws-arn
  term: Amazon Resource Name (ARN)
  match:
  - ARN
  - ARNs
  - Amazon Resource Name
  definition: A unique name for an AWS resource, such as arn:aws:s3:::my-bucket.
  es: Nombre único de un recurso de AWS.
- id: aws-s3
  term: Amazon S3
  match:
  - Amazon S3
  - S3
  - Simple Storage Service
  definition: 'Object storage service: you store files (objects) in buckets and read them over HTTPS. Very durable and scales without limit.'
  es: Servicio de almacenamiento de objetos en buckets, muy duradero.
- id: aws-s3-bucket
  term: S3 bucket
  match:
  - bucket
  - buckets
  - S3 bucket
  - S3 buckets
  certs: [saa, terraform]
  definition: A container for objects in Amazon S3. Its name is unique across all AWS accounts.
  es: Contenedor de objetos en S3, con nombre único global.
- id: aws-bucket-policy
  term: Bucket policy
  match:
  - bucket policy
  - bucket policies
  definition: A resource-based JSON policy attached to an S3 bucket that allows or denies access to it.
  es: Política JSON asociada a un bucket que permite o deniega el acceso.
- id: aws-s3-versioning
  term: S3 Versioning
  match:
  - S3 Versioning
  - bucket versioning
  - noncurrent version
  - noncurrent versions
  definition: A bucket setting that keeps every version of an object, so you can restore files after overwrites or deletes.
  es: Ajuste del bucket que guarda todas las versiones de cada objeto.
- id: aws-s3-lifecycle
  term: S3 Lifecycle
  match:
  - S3 Lifecycle
  - lifecycle rule
  - lifecycle rules
  - lifecycle configuration
  - lifecycle policy
  - lifecycle policies
  definition: Rules that move objects to cheaper storage classes or delete them after a number of days.
  es: Reglas que mueven objetos a clases más baratas o los borran tras unos días.
- id: aws-s3-storage-class
  term: S3 storage class
  match:
  - storage class
  - storage classes
  - S3 Standard
  - S3 Standard-IA
  - S3 One Zone-IA
  - S3 Intelligent-Tiering
  - Intelligent-Tiering
  definition: The way S3 stores an object, with different price, availability and retrieval cost (Standard, Standard-IA, One Zone-IA, Intelligent-Tiering, Glacier).
  es: Clase de almacenamiento de S3, con precio y coste de recuperación distintos.
- id: aws-s3-glacier
  term: S3 Glacier storage classes
  match:
  - S3 Glacier
  - Glacier
  - S3 Glacier Instant Retrieval
  - S3 Glacier Flexible Retrieval
  - S3 Glacier Deep Archive
  - Glacier Deep Archive
  definition: Low-cost S3 storage classes for archives. Deep Archive is the cheapest but retrieval takes up to 12-48 hours.
  es: Clases de S3 de bajo coste para archivo; Deep Archive es la más barata y lenta.
- id: aws-block-public-access
  term: S3 Block Public Access
  match:
  - Block Public Access
  - S3 Block Public Access
  definition: Settings on an account or bucket that stop any public access to S3 data, even if a policy or ACL would allow it.
  es: Ajustes que impiden el acceso público a S3 aunque una política lo permita.
- id: aws-presigned-url
  term: Presigned URL
  match:
  - presigned URL
  - presigned URLs
  definition: A URL signed with someone's credentials that gives time-limited access to one S3 object.
  es: URL firmada que da acceso temporal a un objeto de S3.
- id: aws-sse
  term: Server-side encryption
  match:
  - server-side encryption
  - SSE-S3
  - SSE-KMS
  - SSE-C
  definition: Encryption that AWS does when it writes your data to disk and decryption when you read it, with S3 managed keys, KMS keys or your own keys.
  es: Cifrado que hace AWS al guardar los datos en disco.
- id: aws-s3-replication
  term: S3 Replication
  match:
  - S3 Replication
  - Cross-Region Replication
  - Same-Region Replication
  - CRR
  definition: Automatic, asynchronous copying of objects from one bucket to another bucket in the same or another Region.
  es: Copia automática de objetos a otro bucket, en la misma u otra región.
- id: aws-s3-object-lock
  term: S3 Object Lock
  match:
  - Object Lock
  - S3 Object Lock
  - WORM
  definition: A setting that stops objects from being deleted or overwritten for a fixed time (write once, read many).
  es: Bloqueo que impide borrar o sobrescribir objetos durante un tiempo.
- id: aws-transfer-acceleration
  term: S3 Transfer Acceleration
  match:
  - Transfer Acceleration
  - S3 Transfer Acceleration
  definition: Faster uploads to a bucket over long distances, through CloudFront edge locations.
  es: Subidas más rápidas a S3 desde lejos usando ubicaciones de borde.
- id: aws-kms-key
  term: AWS KMS key
  match:
  - AWS KMS
  - KMS key
  - KMS keys
  - customer managed key
  - customer managed keys
  - key policy
  definition: An encryption key managed by AWS Key Management Service. Its key policy controls who can use it.
  es: Clave de cifrado gestionada por AWS KMS; su política controla quién la usa.
- id: aws-secrets-manager
  term: AWS Secrets Manager
  match:
  - Secrets Manager
  - AWS Secrets Manager
  definition: A service that stores secrets such as database passwords, encrypts them with KMS and can rotate them automatically.
  es: Servicio que guarda secretos, los cifra y puede rotarlos automáticamente.
- id: aws-ssm-parameter-store
  term: SSM Parameter Store
  match:
  - Parameter Store
  - SSM parameter
  - SSM parameters
  - SecureString
  definition: Part of AWS Systems Manager that stores configuration values and secrets (SecureString) in a hierarchy.
  es: Parte de Systems Manager que guarda configuración y secretos.
- id: aws-systems-manager
  term: AWS Systems Manager
  match:
  - Systems Manager
  - AWS Systems Manager
  - Session Manager
  - Patch Manager
  definition: 'A service to manage EC2 and on-premises servers: run commands, patch, and open shell sessions without SSH.'
  es: 'Servicio para gestionar servidores: comandos, parches y sesiones sin SSH.'
- id: aws-acm
  term: AWS Certificate Manager (ACM)
  match:
  - ACM
  - AWS Certificate Manager
  - Certificate Manager
  definition: A service that issues and renews public TLS certificates for load balancers, CloudFront and API Gateway.
  es: Servicio que emite y renueva certificados TLS.
- id: aws-waf
  term: AWS WAF
  match:
  - AWS WAF
  - WAF
  - web ACL
  - web ACLs
  definition: A web application firewall that filters HTTP requests (for example SQL injection or too many requests from one IP) on CloudFront, ALB or API Gateway.
  es: Firewall de aplicaciones web que filtra peticiones HTTP.
- id: aws-shield
  term: AWS Shield
  match:
  - AWS Shield
  - Shield Advanced
  - Shield Standard
  definition: DDoS protection. Shield Standard is free for all; Shield Advanced adds more protection and a response team.
  es: Protección contra ataques DDoS.
- id: aws-guardduty
  term: Amazon GuardDuty
  match:
  - GuardDuty
  - Amazon GuardDuty
  definition: A threat detection service that reads logs (CloudTrail, VPC Flow Logs, DNS) to find suspicious activity.
  es: Servicio que detecta amenazas leyendo registros.
- id: aws-macie
  term: Amazon Macie
  match:
  - Macie
  - Amazon Macie
  definition: A service that finds sensitive data, such as personal data, in S3 buckets.
  es: Servicio que encuentra datos sensibles en S3.
- id: aws-cloudtrail
  term: AWS CloudTrail
  match:
  - CloudTrail
  - AWS CloudTrail
  definition: 'A service that records API calls made in an account: who did what, when and from where.'
  es: Registra las llamadas a la API en la cuenta.
- id: aws-config
  term: AWS Config
  match:
  - AWS Config
  - Config rule
  - Config rules
  definition: A service that records resource configurations over time and checks them against rules.
  es: Registra la configuración de los recursos y la evalúa contra reglas.
- id: aws-vpc
  term: Amazon VPC
  match:
  - VPC
  - VPCs
  - Amazon VPC
  - virtual private cloud
  definition: A private, isolated network in an AWS Region where you launch resources. You choose its IP range (CIDR block).
  es: Red privada y aislada en una región de AWS.
- id: aws-cidr
  term: CIDR block
  match:
  - CIDR
  - CIDR block
  - CIDR blocks
  definition: A range of IP addresses written as address/prefix, such as 10.0.0.0/16.
  es: Rango de direcciones IP en notación dirección/prefijo.
- id: aws-subnet
  term: Subnet
  match:
  - subnet
  - subnets
  - public subnet
  - public subnets
  - private subnet
  - private subnets
  definition: A range of IP addresses inside a VPC, in one Availability Zone. A public subnet has a route to an internet gateway; a private subnet does not.
  es: Rango de IPs de una VPC en una zona; la pública tiene ruta a un internet gateway.
- id: aws-route-table
  term: Route table
  match:
  - route table
  - route tables
  definition: A set of routes that decides where network traffic from a subnet goes.
  es: Tabla de rutas que decide a dónde va el tráfico de una subred.
- id: aws-igw
  term: Internet gateway
  match:
  - internet gateway
  - internet gateways
  definition: A VPC component that lets resources with public IP addresses talk to the internet.
  es: Componente de la VPC que permite comunicar con internet.
- id: aws-nat-gateway
  term: NAT gateway
  match:
  - NAT gateway
  - NAT gateways
  definition: A managed service in a public subnet that lets instances in private subnets reach the internet, while blocking connections started from the internet.
  es: Servicio que deja salir a internet a las subredes privadas sin permitir entradas.
- id: aws-security-group
  term: Security group
  match:
  - security group
  - security groups
  definition: A stateful virtual firewall for an instance or network interface. It has only allow rules.
  es: Firewall virtual con estado para una instancia; solo reglas de permitir.
- id: aws-nacl
  term: Network ACL
  match:
  - network ACL
  - network ACLs
  - NACL
  - NACLs
  definition: A stateless firewall for a subnet with numbered allow and deny rules. Return traffic needs its own rule.
  es: Firewall sin estado de una subred, con reglas de permitir y denegar.
- id: aws-vpc-endpoint
  term: VPC endpoint
  match:
  - VPC endpoint
  - VPC endpoints
  - gateway endpoint
  - gateway endpoints
  - interface endpoint
  - interface endpoints
  - PrivateLink
  - AWS PrivateLink
  definition: A private connection from a VPC to an AWS service without the internet. Gateway endpoints (S3, DynamoDB) are free; interface endpoints use PrivateLink.
  es: Conexión privada de la VPC a un servicio de AWS sin pasar por internet.
- id: aws-vpc-peering
  term: VPC peering
  match:
  - VPC peering
  - peering connection
  - peering connections
  definition: A private network connection between two VPCs. It is not transitive.
  es: Conexión privada entre dos VPC; no es transitiva.
- id: aws-transit-gateway
  term: AWS Transit Gateway
  match:
  - Transit Gateway
  - transit gateways
  - AWS Transit Gateway
  definition: A network hub that connects many VPCs and on-premises networks in a hub-and-spoke design.
  es: Concentrador de red que conecta muchas VPC y redes locales.
- id: aws-vpn
  term: AWS Site-to-Site VPN
  match:
  - Site-to-Site VPN
  - AWS Site-to-Site VPN
  - Client VPN
  - virtual private gateway
  definition: An encrypted IPsec tunnel over the internet between an on-premises network and a VPC.
  es: Túnel cifrado por internet entre la red local y una VPC.
- id: aws-direct-connect
  term: AWS Direct Connect
  match:
  - Direct Connect
  - AWS Direct Connect
  definition: A dedicated private network line from a data center to AWS, with steady bandwidth and latency.
  es: Línea privada dedicada desde un centro de datos a AWS.
- id: aws-flow-logs
  term: VPC Flow Logs
  match:
  - VPC Flow Logs
  - flow logs
  definition: Logs of IP traffic going to and from network interfaces in a VPC.
  es: Registros del tráfico IP de una VPC.
- id: aws-region
  term: AWS Region
  match:
  - AWS Region
  - AWS Regions
  - Region
  - Regions
  definition: A separate geographic area of AWS (for example us-east-1) with several Availability Zones.
  es: Zona geográfica de AWS con varias zonas de disponibilidad.
- id: aws-az
  term: Availability Zone
  match:
  - Availability Zone
  - Availability Zones
  - AZ
  - AZs
  definition: One or more data centers in a Region with separate power and network. Using several AZs protects against the failure of one.
  es: Uno o más centros de datos aislados dentro de una región.
- id: aws-edge-location
  term: Edge location
  match:
  - edge location
  - edge locations
  definition: A site of the AWS global network close to users, used by CloudFront, Route 53 and Global Accelerator.
  es: Punto de la red de AWS cercano a los usuarios.
- id: aws-ec2
  term: Amazon EC2
  match:
  - EC2
  - Amazon EC2
  - EC2 instance
  - EC2 instances
  - instance type
  - instance types
  definition: 'Virtual servers (instances) in the cloud. You choose the instance type: CPU, memory, storage and network.'
  es: Servidores virtuales en la nube.
- id: aws-ami
  term: Amazon Machine Image (AMI)
  match:
  - AMI
  - AMIs
  - Amazon Machine Image
  definition: A template with the operating system and software used to launch EC2 instances.
  es: Plantilla con sistema operativo y software para lanzar instancias.
- id: aws-auto-scaling
  term: EC2 Auto Scaling
  match:
  - Auto Scaling
  - Auto Scaling group
  - Auto Scaling groups
  - EC2 Auto Scaling
  - scaling policy
  - scaling policies
  - target tracking
  definition: A service that keeps the right number of EC2 instances, replaces unhealthy ones and adds or removes instances based on demand.
  es: Servicio que mantiene el número adecuado de instancias según la demanda.
- id: aws-elb
  term: Elastic Load Balancing
  match:
  - Elastic Load Balancing
  - ELB
  - target group
  - target groups
  definition: A service that spreads incoming traffic across targets (EC2, containers, IPs, Lambda) in several AZs and sends it only to healthy targets.
  es: Servicio que reparte el tráfico entre destinos sanos en varias zonas.
- id: aws-alb
  term: Application Load Balancer
  match:
  - Application Load Balancer
  - Application Load Balancers
  - ALB
  - ALBs
  definition: A layer 7 load balancer for HTTP and HTTPS that can route by path or host name.
  es: Balanceador de capa 7 (HTTP/HTTPS) que enruta por ruta o nombre.
- id: aws-nlb
  term: Network Load Balancer
  match:
  - Network Load Balancer
  - Network Load Balancers
  - NLB
  definition: A layer 4 load balancer for TCP and UDP with very high performance and static IP addresses.
  es: Balanceador de capa 4 (TCP/UDP) con IPs estáticas y alto rendimiento.
- id: aws-ebs
  term: Amazon EBS
  match:
  - EBS
  - Amazon EBS
  - EBS volume
  - EBS volumes
  - EBS snapshot
  - EBS snapshots
  - gp3
  - io2
  definition: Block storage volumes for EC2 in one AZ. Snapshots are saved in S3 and can be copied to other Regions.
  es: Volúmenes de bloque para EC2 dentro de una zona.
- id: aws-instance-store
  term: Instance store
  match:
  - instance store
  - instance stores
  definition: Temporary block storage on disks attached to the host. Data is lost when the instance stops or fails.
  es: Almacenamiento temporal en el host; se pierde al parar la instancia.
- id: aws-efs
  term: Amazon EFS
  match:
  - EFS
  - Amazon EFS
  - Elastic File System
  definition: A managed NFS file system that many Linux instances in several AZs can mount at the same time.
  es: Sistema de archivos NFS gestionado que montan muchas instancias.
- id: aws-fsx
  term: Amazon FSx
  match:
  - FSx
  - Amazon FSx
  - FSx for Windows File Server
  - FSx for Lustre
  - FSx for NetApp ONTAP
  definition: 'Managed file systems: Windows File Server (SMB), Lustre (high-performance computing), NetApp ONTAP and OpenZFS.'
  es: Sistemas de archivos gestionados (Windows, Lustre, ONTAP).
- id: aws-storage-gateway
  term: AWS Storage Gateway
  match:
  - Storage Gateway
  - AWS Storage Gateway
  - File Gateway
  - Volume Gateway
  - Tape Gateway
  definition: A hybrid service that gives on-premises apps access to cloud storage through file, volume or tape interfaces.
  es: Servicio híbrido que da acceso local a almacenamiento en la nube.
- id: aws-datasync
  term: AWS DataSync
  match:
  - DataSync
  - AWS DataSync
  definition: A service that copies large amounts of data online between on-premises storage and AWS storage.
  es: Servicio que copia grandes cantidades de datos por red hacia AWS.
- id: aws-snow
  term: AWS Snow Family
  match:
  - Snowball
  - Snowball Edge
  - Snow Family
  - Snowcone
  definition: Physical devices that AWS ships to you to move very large data sets offline.
  es: Dispositivos físicos para mover grandes volúmenes de datos sin red.
- id: aws-backup
  term: AWS Backup
  match:
  - AWS Backup
  - backup plan
  - backup plans
  - backup vault
  definition: A service that centrally schedules and stores backups of many AWS services.
  es: Servicio que programa y guarda copias de seguridad de forma central.
- id: aws-rds
  term: Amazon RDS
  match:
  - RDS
  - Amazon RDS
  - Relational Database Service
  - DB instance
  - DB instances
  definition: Managed relational databases (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server). AWS handles patching and backups.
  es: Bases de datos relacionales gestionadas.
- id: aws-multi-az
  term: Multi-AZ deployment
  match:
  - Multi-AZ
  - Multi-AZ deployment
  - Multi-AZ DB cluster
  definition: An RDS setup with a synchronous standby copy in another AZ and automatic failover.
  es: Despliegue con copia en espera en otra zona y conmutación automática.
- id: aws-read-replica
  term: Read replica
  match:
  - read replica
  - read replicas
  definition: An asynchronous copy of a database that serves read traffic. It can be in another Region and can be promoted.
  es: Copia asíncrona de la base de datos para lecturas.
- id: aws-rds-proxy
  term: Amazon RDS Proxy
  match:
  - RDS Proxy
  - Amazon RDS Proxy
  definition: A managed database proxy that pools and shares connections, useful with Lambda and many short connections.
  es: Proxy gestionado que agrupa conexiones a la base de datos.
- id: aws-aurora
  term: Amazon Aurora
  match:
  - Aurora
  - Amazon Aurora
  - Aurora Serverless
  - Aurora Replica
  - Aurora Replicas
  - Aurora global database
  definition: A MySQL- and PostgreSQL-compatible AWS database with storage copied six times across three AZs.
  es: Base de datos de AWS compatible con MySQL y PostgreSQL.
- id: aws-dynamodb
  term: Amazon DynamoDB
  match:
  - DynamoDB
  - Amazon DynamoDB
  - partition key
  - sort key
  - on-demand capacity
  - provisioned capacity
  - DynamoDB Streams
  - global tables
  definition: A serverless key-value and document database with single-digit millisecond latency at any scale.
  es: Base de datos NoSQL sin servidor de clave-valor.
- id: aws-gsi
  term: Global secondary index
  match:
  - global secondary index
  - global secondary indexes
  - GSI
  - GSIs
  - local secondary index
  - LSI
  definition: A DynamoDB index with a different partition key (and sort key) than the table, to query by other attributes.
  es: Índice de DynamoDB con otra clave para consultar por otros atributos.
- id: aws-ttl
  term: Time to Live (TTL)
  match:
  - TTL
  - Time to Live
  definition: A DynamoDB setting that deletes items automatically after the time stored in one attribute (epoch seconds).
  es: Ajuste de DynamoDB que borra elementos tras la fecha de un atributo.
- id: aws-dax
  term: DynamoDB Accelerator (DAX)
  match:
  - DAX
  - DynamoDB Accelerator
  definition: An in-memory cache for DynamoDB that gives microsecond read latency.
  es: Caché en memoria para DynamoDB.
- id: aws-elasticache
  term: Amazon ElastiCache
  match:
  - ElastiCache
  - Amazon ElastiCache
  - Redis OSS
  - Valkey
  - Memcached
  definition: Managed in-memory caches (Valkey, Redis OSS, Memcached) to make reads faster and keep session data.
  es: Cachés en memoria gestionadas.
- id: aws-redshift
  term: Amazon Redshift
  match:
  - Redshift
  - Amazon Redshift
  definition: A managed data warehouse for analytics (SQL) on large amounts of structured data.
  es: Almacén de datos para analítica.
- id: aws-athena
  term: Amazon Athena
  match:
  - Athena
  - Amazon Athena
  definition: A serverless service to run SQL queries directly on data in S3. You pay per data scanned.
  es: Servicio sin servidor para consultas SQL sobre S3.
- id: aws-glue
  term: AWS Glue
  match:
  - AWS Glue
  - Glue
  - Data Catalog
  definition: A serverless ETL service with a Data Catalog that describes data sets for Athena and other tools.
  es: Servicio ETL sin servidor con catálogo de datos.
- id: aws-kinesis
  term: Amazon Kinesis
  match:
  - Kinesis
  - Kinesis Data Streams
  - Amazon Data Firehose
  - Data Firehose
