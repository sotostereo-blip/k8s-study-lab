id: ckad-design-002
title: Pick the right workload - DaemonSet and CronJob
domain: design-build
difficulty: 2
minutes: 10
environment: single-node
setup: |
  kubectl create namespace ops-workloads
task: |
  Work in the namespace `ops-workloads`. Choose the right workload resource for each need.

  1. A log agent must run **one Pod on every node** of the cluster.
     Create it with the name `node-log-agent`, image `busybox:1.36`, command `sleep 3600`.
     Mount the node folder `/var/log` (hostPath) **read-only** at `/host/var/log`.
  2. A cleanup script must run **every 30 minutes**. Create `report-cleanup`
     with image `busybox:1.36` and command `sh -c "echo cleaning old reports"`.
     - A new run must not start while the last one is still running (`Forbid`).
     - Keep only the last `2` successful runs.
  3. Do not wait 30 minutes: start one run now, as a Job called `report-cleanup-now`
     created **from** `report-cleanup`. It must complete.
checks:
  - name: DaemonSet `node-log-agent` has a ready Pod on every node
    run: |
      d=$(kubectl -n ops-workloads get ds node-log-agent -o json)
      want=$(kubectl get nodes --no-headers | wc -l)
      [ "$(echo "$d" | jq '.status.numberReady')" -eq "$want" ] && [ "$(echo "$d" | jq '.status.desiredNumberScheduled')" -eq "$want" ]
  - name: The DaemonSet mounts hostPath /var/log read-only at /host/var/log
    run: |
      kubectl -n ops-workloads get ds node-log-agent -o json | jq -e '
        .spec.template.spec as $s
        | ($s.volumes[] | select(.hostPath.path=="/var/log") | .name) as $v
        | $s.containers[0].volumeMounts[] | select(.name==$v and .mountPath=="/host/var/log" and .readOnly==true)'
  - name: CronJob `report-cleanup` runs every 30 minutes with image busybox:1.36
    run: |
      c=$(kubectl -n ops-workloads get cronjob report-cleanup -o json)
      [ "$(echo "$c" | jq -r .spec.schedule)" = "*/30 * * * *" ] &&
      [ "$(echo "$c" | jq -r '.spec.jobTemplate.spec.template.spec.containers[0].image')" = busybox:1.36 ]
  - name: The CronJob uses concurrencyPolicy Forbid and keeps 2 successful Jobs
    run: |
      c=$(kubectl -n ops-workloads get cronjob report-cleanup -o json)
      [ "$(echo "$c" | jq -r .spec.concurrencyPolicy)" = Forbid ] &&
      [ "$(echo "$c" | jq -r .spec.successfulJobsHistoryLimit)" = 2 ]
  - name: Job `report-cleanup-now` was created from the CronJob and completed
    run: |
      j=$(kubectl -n ops-workloads get job report-cleanup-now -o json)
      echo "$j" | jq -e '.metadata.ownerReferences[] | select(.kind=="CronJob" and .name=="report-cleanup")' >/dev/null &&
      [ "$(echo "$j" | jq -r '.status.succeeded')" = 1 ]
solution: |
  # 1. DaemonSet: there is no "kubectl create daemonset"; start from a Deployment and edit it
  kubectl -n ops-workloads create deployment node-log-agent --image=busybox:1.36 $do -- sleep 3600 > ds.yaml
  # in ds.yaml: kind: DaemonSet, remove replicas/strategy/status, and add:
  #   volumes:   - name: varlog
  #                hostPath: { path: /var/log }
  #   container volumeMounts: - name: varlog
  #                             mountPath: /host/var/log
  #                             readOnly: true
  kubectl apply -f ds.yaml
  # 2. CronJob
  kubectl -n ops-workloads create cronjob report-cleanup --image=busybox:1.36 \
    --schedule="*/30 * * * *" -- sh -c "echo cleaning old reports"
  kubectl -n ops-workloads patch cronjob report-cleanup \
    -p '{"spec":{"concurrencyPolicy":"Forbid","successfulJobsHistoryLimit":2}}'
  # 3. a Job from the CronJob
  kubectl -n ops-workloads create job report-cleanup-now --from=cronjob/report-cleanup
  kubectl -n ops-workloads get jobs
auto_solution: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: DaemonSet
  metadata: { name: node-log-agent, namespace: ops-workloads }
  spec:
    selector: { matchLabels: { app: node-log-agent } }
    template:
      metadata: { labels: { app: node-log-agent } }
      spec:
        containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts: [{ name: varlog, mountPath: /host/var/log, readOnly: true }]
        volumes:
        - name: varlog
          hostPath: { path: /var/log }
  YAML
  kubectl -n ops-workloads create cronjob report-cleanup --image=busybox:1.36 \
    --schedule="*/30 * * * *" -- sh -c "echo cleaning old reports"
  kubectl -n ops-workloads patch cronjob report-cleanup \
    -p '{"spec":{"concurrencyPolicy":"Forbid","successfulJobsHistoryLimit":2}}'
  kubectl -n ops-workloads create job report-cleanup-now --from=cronjob/report-cleanup
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
  - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
