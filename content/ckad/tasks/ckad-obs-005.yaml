id: ckad-obs-005
title: Debug a crashing command and a shell-less container
domain: observability
difficulty: 2
minutes: 10
environment: single-node
setup: |
  kubectl create namespace warehouse
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: inventory-sync, namespace: warehouse }
  spec:
    replicas: 1
    selector: { matchLabels: { app: inventory-sync } }
    template:
      metadata: { labels: { app: inventory-sync } }
      spec:
        containers:
        - name: sync
          image: busybox:1.36
          command: ["sh", "-c", "echo syncing stock; sleeep 3600"]
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: pricing-engine, namespace: warehouse }
  spec:
    containers:
    - name: pricing
      image: registry.k8s.io/pause:3.10
  YAML
task: |
  Two problems in namespace `warehouse`:

  1. The Deployment `inventory-sync` is in `CrashLoopBackOff`. Read the logs, find the
     mistake in the container command and fix it. The container must print
     `syncing stock` and then sleep for `3600` seconds.
  2. The Pod `pricing-engine` runs an image with **no shell**, so `kubectl exec` cannot help.
     Add an **ephemeral debug container** called `debugger` with image `busybox:1.36` that
     **targets** the container `pricing` (so it can see its processes).
     Do not recreate the Pod.
checks:
  - name: Deployment `inventory-sync` has 1 ready replica that stays up and prints "syncing stock"
    run: |
      d=$(kubectl -n warehouse get deploy inventory-sync -o json)
      [ "$(echo "$d" | jq .status.readyReplicas)" = 1 ] && [ "$(echo "$d" | jq .status.updatedReplicas)" = 1 ] &&
      kubectl -n warehouse get pods -l app=inventory-sync -o json | jq -e '[.items[] | select(.metadata.deletionTimestamp==null)
        | .status.containerStatuses[0] | select(.restartCount==0 and .state.running != null
        and (now - (.state.running.startedAt | fromdate)) > 10)] | length == 1' >/dev/null &&
      kubectl -n warehouse logs deploy/inventory-sync | grep -q "syncing stock"
  - name: Pod `pricing-engine` has the ephemeral container `debugger` (busybox:1.36, target pricing)
    run: |
      kubectl -n warehouse get pod pricing-engine -o json | jq -e '.spec.ephemeralContainers[]?
        | select(.name=="debugger" and .image=="busybox:1.36" and .targetContainerName=="pricing")'
  - name: Pod `pricing-engine` was not recreated (it is still Running)
    run: '[ "$(kubectl -n warehouse get pod pricing-engine -o jsonpath="{.status.phase}")" = Running ]'
    guard: true
solution: |
  kubectl -n warehouse logs deploy/inventory-sync      # sh: sleeep: not found
  kubectl -n warehouse edit deployment inventory-sync  # fix "sleeep" -> "sleep"
  kubectl -n warehouse rollout status deployment/inventory-sync
  kubectl -n warehouse exec pricing-engine -- sh       # fails: no shell in the image
  kubectl -n warehouse debug -it pricing-engine --image=busybox:1.36 --container=debugger --target=pricing -- sh
  # inside the debug container:  ps   (you see the /pause process of the target container)
auto_solution: |
  kubectl -n warehouse patch deployment inventory-sync --type=json \
    -p '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["sh","-c","echo syncing stock; sleep 3600"]}]'
  kubectl -n warehouse debug pricing-engine --image=busybox:1.36 --container=debugger --target=pricing -- sleep 600
  kubectl -n warehouse rollout status deployment/inventory-sync --timeout=120s
docs:
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/#ephemeral-container
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
