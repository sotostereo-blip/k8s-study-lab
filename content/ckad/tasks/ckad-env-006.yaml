id: ckad-env-006
title: Dedicated ServiceAccount without an API token
domain: environment
difficulty: 2
minutes: 8
environment: single-node
setup: |
  kubectl create namespace telemetry
task: |
  In namespace `telemetry`:

  1. Create a ServiceAccount `metrics-reader` that does **not** mount its API token into
     Pods by default (`automountServiceAccountToken: false`).
  2. Create a Pod `telemetry-agent` (`busybox:1.36`, command `sleep 3600`) that uses this
     ServiceAccount. It must **not** have the token folder
     `/var/run/secrets/kubernetes.io/serviceaccount`.
  3. Create a Pod `telemetry-uploader` (`busybox:1.36`, command `sleep 3600`) with the same
     ServiceAccount, but this Pod **does** need the token: turn the automount on in the
     Pod spec.
checks:
  - name: ServiceAccount `metrics-reader` has automountServiceAccountToken false
    run: '[ "$(kubectl -n telemetry get sa metrics-reader -o jsonpath="{.automountServiceAccountToken}")" = false ]'
  - name: Pod `telemetry-agent` runs as metrics-reader without a token
    run: |
      [ "$(kubectl -n telemetry get pod telemetry-agent -o jsonpath='{.spec.serviceAccountName}')" = metrics-reader ] &&
      [ "$(kubectl -n telemetry get pod telemetry-agent -o jsonpath='{.status.phase}')" = Running ] &&
      ! kubectl -n telemetry exec telemetry-agent -- ls /var/run/secrets/kubernetes.io/serviceaccount/token
  - name: Pod `telemetry-uploader` runs as metrics-reader and has the token
    run: |
      [ "$(kubectl -n telemetry get pod telemetry-uploader -o jsonpath='{.spec.serviceAccountName}')" = metrics-reader ] &&
      kubectl -n telemetry exec telemetry-uploader -- ls /var/run/secrets/kubernetes.io/serviceaccount/token
solution: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: ServiceAccount
  metadata: { name: metrics-reader, namespace: telemetry }
  automountServiceAccountToken: false
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: telemetry-agent, namespace: telemetry }
  spec:
    serviceAccountName: metrics-reader
    containers:
    - { name: agent, image: busybox:1.36, command: ["sleep", "3600"] }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: telemetry-uploader, namespace: telemetry }
  spec:
    serviceAccountName: metrics-reader
    automountServiceAccountToken: true     # the Pod setting wins over the ServiceAccount
    containers:
    - { name: uploader, image: busybox:1.36, command: ["sleep", "3600"] }
  YAML
docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
