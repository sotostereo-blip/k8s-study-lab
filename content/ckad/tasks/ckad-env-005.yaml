id: ckad-env-005
title: Move a password from plain env to a Secret
domain: environment
difficulty: 2
minutes: 10
environment: single-node
setup: |
  kubectl create namespace crm
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: crm-backend, namespace: crm }
  spec:
    replicas: 1
    selector: { matchLabels: { app: crm-backend } }
    template:
      metadata: { labels: { app: crm-backend } }
      spec:
        containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
          - { name: DB_USER, value: crm_app }
          - { name: DB_PASSWORD, value: changeme-in-plain-text }
  YAML
task: |
  The Deployment `crm-backend` (namespace `crm`) has the database password in plain text
  in its spec. Fix it:

  1. Create a generic Secret `crm-db-credentials` with two keys:
     `DB_USER=crm_app` and `DB_PASSWORD=Xk9-lab-2026`.
  2. Change the Deployment so the env variables `DB_USER` and `DB_PASSWORD` **read their
     values from the Secret** (no plain `value` any more).
  3. Also mount the Secret as files, **read-only**, at `/etc/crm/db` in the container.
checks:
  - name: Secret `crm-db-credentials` has DB_USER and DB_PASSWORD
    run: |
      s=$(kubectl -n crm get secret crm-db-credentials -o json)
      [ "$(echo "$s" | jq -r .data.DB_USER | base64 -d)" = crm_app ] &&
      [ "$(echo "$s" | jq -r .data.DB_PASSWORD | base64 -d)" = Xk9-lab-2026 ]
  - name: DB_USER and DB_PASSWORD use secretKeyRef (no plain value)
    run: |
      kubectl -n crm get deploy crm-backend -o json | jq -e '[.spec.template.spec.containers[0].env[]
        | select(.name=="DB_USER" or .name=="DB_PASSWORD")
        | select(.value==null and .valueFrom.secretKeyRef.name=="crm-db-credentials" and .valueFrom.secretKeyRef.key==.name)] | length == 2'
  - name: The Secret is mounted read-only at /etc/crm/db
    run: |
      kubectl -n crm get deploy crm-backend -o json | jq -e '
        .spec.template.spec as $s
        | ($s.volumes[] | select(.secret.secretName=="crm-db-credentials") | .name) as $v
        | $s.containers[0].volumeMounts[] | select(.name==$v and .mountPath=="/etc/crm/db" and .readOnly==true)'
  - name: The running Pod sees the new password in env and in /etc/crm/db
    run: |
      [ "$(kubectl -n crm get deploy crm-backend -o jsonpath='{.status.updatedReplicas}')" = 1 ] &&
      [ "$(kubectl -n crm exec deploy/crm-backend -- printenv DB_PASSWORD)" = Xk9-lab-2026 ] &&
      [ "$(kubectl -n crm exec deploy/crm-backend -- cat /etc/crm/db/DB_USER)" = crm_app ]
solution: |
  kubectl -n crm create secret generic crm-db-credentials \
    --from-literal=DB_USER=crm_app --from-literal=DB_PASSWORD=Xk9-lab-2026
  kubectl -n crm edit deployment crm-backend
  # container "app":
  #   env:
  #   - name: DB_USER
  #     valueFrom: { secretKeyRef: { name: crm-db-credentials, key: DB_USER } }
  #   - name: DB_PASSWORD
  #     valueFrom: { secretKeyRef: { name: crm-db-credentials, key: DB_PASSWORD } }
  #   volumeMounts:
  #   - { name: db-creds, mountPath: /etc/crm/db, readOnly: true }
  # pod spec:
  #   volumes:
  #   - name: db-creds
  #     secret: { secretName: crm-db-credentials }
  # (kubectl set env deployment/crm-backend --from=secret/crm-db-credentials also replaces the env)
  kubectl -n crm rollout status deployment/crm-backend
auto_solution: |
  kubectl -n crm create secret generic crm-db-credentials \
    --from-literal=DB_USER=crm_app --from-literal=DB_PASSWORD=Xk9-lab-2026
  kubectl -n crm patch deployment crm-backend --type=json -p '[
    {"op":"replace","path":"/spec/template/spec/containers/0/env","value":[
      {"name":"DB_USER","valueFrom":{"secretKeyRef":{"name":"crm-db-credentials","key":"DB_USER"}}},
      {"name":"DB_PASSWORD","valueFrom":{"secretKeyRef":{"name":"crm-db-credentials","key":"DB_PASSWORD"}}}]},
    {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts","value":[{"name":"db-creds","mountPath":"/etc/crm/db","readOnly":true}]},
    {"op":"add","path":"/spec/template/spec/volumes","value":[{"name":"db-creds","secret":{"secretName":"crm-db-credentials"}}]}]'
  kubectl -n crm rollout status deployment/crm-backend --timeout=120s
docs:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
