id: ckad-design-003
title: Init container and native sidecar
domain: design-build
difficulty: 3
minutes: 12
environment: single-node
setup: |
  kubectl create namespace newsroom
  mkdir -p /root/newsroom
  cat > /root/newsroom/news-portal.yaml <<'YAML'
  apiVersion: v1
  kind: Pod
  metadata:
    name: news-portal
    namespace: newsroom
  spec:
    containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
      - containerPort: 80
  YAML
task: |
  The file `/root/newsroom/news-portal.yaml` has a Pod with one container `web` (nginx).
  Complete it and create the Pod `news-portal` in namespace `newsroom`:

  1. Add two `emptyDir` volumes: `content` and `logs`.
  2. An **init container** `fetch-content` (`busybox:1.36`) writes the text
     `breaking news` into `/work/index.html` (volume `content` mounted at `/work`) and ends.
  3. The `web` container mounts `content` at `/usr/share/nginx/html`
     and `logs` at `/var/log/nginx`.
  4. A **native sidecar** `log-shipper` (`busybox:1.36`) runs for the whole life of the Pod
     and prints the access log: `sh -c "touch /logs/access.log; tail -F /logs/access.log"`
     (volume `logs` mounted at `/logs`). Use the native sidecar way: an init container with
     `restartPolicy: Always`.

  When it works, `wget -qO- localhost` inside `web` shows `breaking news` and the request
  appears in `kubectl logs news-portal -c log-shipper`.
checks:
  - name: Pod `news-portal` is Ready
    run: '[ "$(kubectl -n newsroom get pod news-portal -o jsonpath="{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  - name: fetch-content is a normal init container (it ends)
    run: kubectl -n newsroom get pod news-portal -o json | jq -e '.spec.initContainers[] | select(.name=="fetch-content" and (.restartPolicy // "") != "Always")'
  - name: log-shipper is a native sidecar (init container with restartPolicy Always)
    run: kubectl -n newsroom get pod news-portal -o json | jq -e '.spec.initContainers[] | select(.name=="log-shipper" and .restartPolicy=="Always")'
  - name: nginx serves "breaking news"
    run: kubectl -n newsroom exec news-portal -c web -- wget -qO- http://localhost/ | grep -q "breaking news"
  - name: The sidecar prints the nginx access log
    run: |
      kubectl -n newsroom exec news-portal -c web -- wget -qO- http://localhost/ >/dev/null
      sleep 2
      kubectl -n newsroom logs news-portal -c log-shipper | grep -q "GET / "
solution: |
  # edit /root/newsroom/news-portal.yaml so the spec looks like this:
  #   spec:
  #     volumes:
  #     - name: content
  #       emptyDir: {}
  #     - name: logs
  #       emptyDir: {}
  #     initContainers:
  #     - name: fetch-content
  #       image: busybox:1.36
  #       command: ["sh", "-c", "echo 'breaking news' > /work/index.html"]
  #       volumeMounts: [{ name: content, mountPath: /work }]
  #     - name: log-shipper
  #       image: busybox:1.36
  #       restartPolicy: Always          # this makes it a native sidecar
  #       command: ["sh", "-c", "touch /logs/access.log; tail -F /logs/access.log"]
  #       volumeMounts: [{ name: logs, mountPath: /logs }]
  #     containers:
  #     - name: web
  #       image: nginx:1.27-alpine
  #       ports: [{ containerPort: 80 }]
  #       volumeMounts:
  #       - { name: content, mountPath: /usr/share/nginx/html }
  #       - { name: logs, mountPath: /var/log/nginx }
  kubectl apply -f /root/newsroom/news-portal.yaml
  kubectl -n newsroom exec news-portal -c web -- wget -qO- localhost
  kubectl -n newsroom logs news-portal -c log-shipper
auto_solution: |
  cat > /root/newsroom/news-portal.yaml <<'YAML'
  apiVersion: v1
  kind: Pod
  metadata:
    name: news-portal
    namespace: newsroom
  spec:
    volumes:
    - name: content
      emptyDir: {}
    - name: logs
      emptyDir: {}
    initContainers:
    - name: fetch-content
      image: busybox:1.36
      command: ["sh", "-c", "echo 'breaking news' > /work/index.html"]
      volumeMounts: [{ name: content, mountPath: /work }]
    - name: log-shipper
      image: busybox:1.36
      restartPolicy: Always
      command: ["sh", "-c", "touch /logs/access.log; tail -F /logs/access.log"]
      volumeMounts: [{ name: logs, mountPath: /logs }]
    containers:
    - name: web
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
      volumeMounts:
      - { name: content, mountPath: /usr/share/nginx/html }
      - { name: logs, mountPath: /var/log/nginx }
  YAML
  kubectl apply -f /root/newsroom/news-portal.yaml
  kubectl -n newsroom wait --for=condition=Ready pod/news-portal --timeout=120s
docs:
  - https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
  - https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
