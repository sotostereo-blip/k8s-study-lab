id: ckad-obs-003
title: Find the busy Pod with kubectl top and events
domain: observability
difficulty: 1
minutes: 6
environment: single-node
setup: |
  kubectl create namespace perf-lab
  for p in email-sender search-indexer; do
    kubectl -n perf-lab run $p --image=busybox:1.36 -- sleep 3600
  done
  kubectl -n perf-lab run pdf-renderer --image=busybox:1.36 \
    --overrides='{"spec":{"containers":[{"name":"pdf-renderer","image":"busybox:1.36","command":["sh","-c","while true; do :; done"],"resources":{"limits":{"cpu":"200m"}}}]}}'
  kubectl -n perf-lab run thumbnail-maker --image=busybox:1.36-musl-missing -- sleep 3600
task: |
  Several Pods run in the namespace `perf-lab`. Use the built-in kubectl tools
  (`kubectl top`, `kubectl get events`, `kubectl describe`) to answer:

  1. Which Pod uses the **most CPU**? Write only its name to `/root/perf/top-cpu-pod.txt`.
  2. One Pod has **Warning** events and never starts. Write only its name to
     `/root/perf/warning-pod.txt`.

  Tip: metrics can take about a minute to appear after a Pod starts.
checks:
  - name: /root/perf/top-cpu-pod.txt names the Pod that uses the most CPU
    run: '[ "$(tr -d " \n" < /root/perf/top-cpu-pod.txt)" = pdf-renderer ]'
  - name: /root/perf/warning-pod.txt names the Pod with Warning events
    run: '[ "$(tr -d " \n" < /root/perf/warning-pod.txt)" = thumbnail-maker ]'
solution: |
  mkdir -p /root/perf
  kubectl -n perf-lab top pod --sort-by=cpu
  kubectl -n perf-lab top pod --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > /root/perf/top-cpu-pod.txt
  kubectl -n perf-lab get events --field-selector type=Warning
  kubectl -n perf-lab get events --field-selector type=Warning -o jsonpath='{.items[0].involvedObject.name}' > /root/perf/warning-pod.txt
auto_solution: |
  mkdir -p /root/perf
  for i in $(seq 40); do
    top=$(kubectl -n perf-lab top pod --sort-by=cpu --no-headers 2>/dev/null | head -1 | awk '{print $1}')
    [ "$top" = pdf-renderer ] && break
    sleep 5
  done
  echo "$top" > /root/perf/top-cpu-pod.txt
  kubectl -n perf-lab get events --field-selector type=Warning -o jsonpath='{.items[0].involvedObject.name}' > /root/perf/warning-pod.txt
docs:
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_pod/
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
