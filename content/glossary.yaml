# Technical glossary. `definition` is in simple English (the main study aid);
# `es` is the Spanish fallback, shown only on demand.
# `match` lists the forms highlighted in question text (case-insensitive).
terms:
  - id: pod
    term: Pod
    match: [Pod, Pods]
    definition: The smallest unit Kubernetes runs. A group of one or more containers that share network and storage.
    es: La unidad mínima que ejecuta Kubernetes; uno o más contenedores que comparten red y almacenamiento.
  - id: container
    term: Container
    match: [container, containers]
    definition: A packaged application with everything it needs to run, isolated from other processes.
    es: Aplicación empaquetada con todo lo que necesita para ejecutarse, aislada de otros procesos.
  - id: node
    term: Node
    match: [node, nodes]
    definition: A machine (virtual or physical) that runs Pods. It has a kubelet and a container runtime.
    es: Máquina (virtual o física) que ejecuta Pods.
  - id: control-plane
    term: Control plane
    match: [control plane]
    definition: The components that make global decisions about the cluster, such as the API server, scheduler and etcd.
    es: Plano de control; los componentes que toman las decisiones globales del clúster.
  - id: etcd
    term: etcd
    match: [etcd]
    definition: A distributed key-value store where Kubernetes keeps all cluster data.
    es: Almacén clave-valor distribuido donde Kubernetes guarda todo el estado del clúster.
  - id: kube-apiserver
    term: kube-apiserver
    match: [kube-apiserver, API server]
    definition: The front door of the control plane. Every request to the cluster goes through it.
    es: La puerta de entrada del plano de control; toda petición al clúster pasa por él.
  - id: kube-scheduler
    term: kube-scheduler
    match: [kube-scheduler, scheduler]
    definition: Chooses which node each new Pod should run on.
    es: Elige en qué nodo se ejecuta cada Pod nuevo.
  - id: kubelet
    term: kubelet
    match: [kubelet]
    definition: An agent on every node that makes sure the containers described in Pods are running and healthy.
    es: Agente en cada nodo que asegura que los contenedores de los Pods estén corriendo y sanos.
  - id: container-runtime
    term: Container runtime
    match: [container runtime, container runtimes]
    definition: The software that actually runs containers, for example containerd or CRI-O.
    es: Software que ejecuta los contenedores, por ejemplo containerd o CRI-O.
  - id: cri
    term: CRI
    match: [CRI, Container Runtime Interface]
    definition: Container Runtime Interface. The API the kubelet uses to talk to the container runtime.
    es: Interfaz entre el kubelet y el runtime de contenedores.
  - id: service
    term: Service
    match: [Service, Services]
    definition: A stable network address and name for a set of Pods, with load balancing between them.
    es: Dirección y nombre de red estables para un grupo de Pods, con balanceo de carga.
  - id: ingress
    term: Ingress
    match: [Ingress, Ingresses]
    definition: Rules that route external HTTP/HTTPS traffic to Services inside the cluster.
    es: Reglas que enrutan tráfico HTTP/HTTPS externo hacia Services del clúster.
  - id: deployment
    term: Deployment
    match: [Deployment, Deployments]
    definition: Manages a set of identical Pods and handles rolling updates and rollbacks.
    es: Gestiona un conjunto de Pods idénticos y sus actualizaciones y rollbacks.
  - id: statefulset
    term: StatefulSet
    match: [StatefulSet, StatefulSets]
    definition: Like a Deployment, but each Pod has a stable name and its own persistent storage.
    es: Como un Deployment, pero cada Pod tiene nombre estable y almacenamiento propio.
  - id: daemonset
    term: DaemonSet
    match: [DaemonSet, DaemonSets]
    definition: Runs one copy of a Pod on every node (or on selected nodes).
    es: Ejecuta una copia de un Pod en cada nodo (o en nodos seleccionados).
  - id: replica
    term: Replica
    match: [replica, replicas]
    definition: One copy of a Pod. A workload can run several replicas for capacity and availability.
    es: Una copia de un Pod.
  - id: configmap
    term: ConfigMap
    match: [ConfigMap, ConfigMaps]
    definition: Stores non-confidential configuration as key-value pairs for Pods to use.
    es: Guarda configuración no confidencial como pares clave-valor.
  - id: secret
    term: Secret
    match: [Secret, Secrets]
    definition: Stores small amounts of sensitive data, such as passwords or tokens.
    es: Guarda pequeñas cantidades de datos sensibles, como contraseñas o tokens.
  - id: rbac
    term: RBAC
    match: [RBAC]
    definition: Role-Based Access Control. Decides who can do which actions on which resources.
    es: Control de acceso basado en roles.
  - id: probe
    term: Probe
    match: [probe, probes, liveness probe, readiness probe]
    definition: A periodic health check the kubelet runs on a container (liveness, readiness or startup).
    es: Chequeo de salud periódico que el kubelet hace a un contenedor.
  - id: hpa
    term: HPA
    match: [Horizontal Pod Autoscaler, HPA]
    definition: Horizontal Pod Autoscaler. Changes the number of replicas automatically based on metrics.
    es: Escala automáticamente el número de réplicas según métricas.
  - id: gitops
    term: GitOps
    match: [GitOps]
    definition: Managing infrastructure and apps by declaring the desired state in Git and letting an agent apply it.
    es: Gestionar infraestructura y apps declarando el estado deseado en Git.
  - id: reconciliation
    term: Reconciliation
    match: [reconciles, reconcile, reconciliation]
    definition: The loop that compares desired state with actual state and fixes any difference.
    es: Ciclo que compara el estado deseado con el real y corrige las diferencias.
  - id: helm
    term: Helm
    match: [Helm]
    definition: A package manager for Kubernetes. Packages are called charts.
    es: Gestor de paquetes para Kubernetes; los paquetes se llaman charts.
  - id: manifest
    term: Manifest
    match: [manifest, manifests]
    definition: A YAML or JSON file that describes a Kubernetes object you want to create.
    es: Archivo YAML o JSON que describe un objeto de Kubernetes.
  - id: prometheus
    term: Prometheus
    match: [Prometheus]
    definition: An open source monitoring system that collects metrics by scraping HTTP endpoints.
    es: Sistema de monitoreo que recolecta métricas consultando endpoints HTTP.
  - id: metrics
    term: Metrics
    match: [metrics]
    definition: Numeric measurements over time, such as CPU usage or request count.
    es: Mediciones numéricas en el tiempo, como uso de CPU o número de peticiones.
  - id: observability
    term: Observability
    match: [observability]
    definition: How well you can understand a system's internal state from its outputs, mainly metrics, logs and traces.
    es: Capacidad de entender el estado interno de un sistema a partir de métricas, logs y trazas.
  # --- added with the 150-question bank ---
  - { id: namespace, term: Namespace, match: [Namespace, Namespaces], definition: "A virtual space inside a cluster that scopes object names and groups resources for a team or project.", es: "Espacio virtual dentro del clúster que agrupa recursos y limita el alcance de los nombres." }
  - { id: label, term: Label, match: [label, labels], definition: "A key-value pair attached to an object, used to identify and select groups of objects.", es: "Par clave-valor asociado a un objeto, usado para identificarlo y seleccionarlo." }
  - { id: selector, term: Selector, match: [selector, selectors, label selector], definition: "A query on labels that picks a set of objects, for example the Pods behind a Service.", es: "Consulta sobre etiquetas que selecciona un grupo de objetos." }
  - { id: annotation, term: Annotation, match: [annotation, annotations], definition: "Non-identifying metadata attached to an object for tools and people; it cannot be used to select objects.", es: "Metadatos no identificadores para herramientas y personas; no sirven para seleccionar." }
  - { id: kubectl, term: kubectl, match: [kubectl], definition: "The command-line tool to talk to the Kubernetes API.", es: "Herramienta de línea de comandos para interactuar con la API de Kubernetes." }
  - { id: controller, term: Controller, match: [controller, controllers], definition: "A control loop that watches the cluster and acts to move the current state toward the desired state.", es: "Ciclo de control que observa el clúster y lo acerca al estado deseado." }
  - { id: kube-controller-manager, term: kube-controller-manager, match: [kube-controller-manager], definition: "The control plane component that runs the built-in controllers.", es: "Componente del plano de control que ejecuta los controladores integrados." }
  - { id: cloud-controller-manager, term: cloud-controller-manager, match: [cloud-controller-manager], definition: "The component that runs controllers which talk to a cloud provider, for example to create load balancers.", es: "Componente que ejecuta los controladores que hablan con el proveedor cloud." }
  - { id: kube-proxy, term: kube-proxy, match: [kube-proxy], definition: "A node agent that programs network rules so traffic to a Service reaches its Pods.", es: "Agente del nodo que configura reglas de red para que el tráfico de un Service llegue a sus Pods." }
  - { id: replicaset, term: ReplicaSet, match: [ReplicaSet, ReplicaSets], definition: "Keeps a stable number of identical Pods running. Deployments manage ReplicaSets for you.", es: "Mantiene un número estable de Pods idénticos; los Deployments lo gestionan." }
  - { id: rolling-update, term: Rolling update, match: [RollingUpdate, rolling update, rollout], definition: "Replacing Pods gradually with a new version so the application stays available.", es: "Reemplazo gradual de Pods por una nueva versión sin cortar el servicio." }
  - { id: rollback, term: Rollback, match: [rollback, roll back, rolls back], definition: "Returning an application to a previous version.", es: "Volver una aplicación a una versión anterior." }
  - { id: job, term: Job, match: [Job, Jobs], definition: "Runs one or more Pods until a task completes successfully.", es: "Ejecuta Pods hasta que una tarea termina con éxito." }
  - { id: cronjob, term: CronJob, match: [CronJob, CronJobs], definition: "Creates Jobs on a repeating schedule written in cron format.", es: "Crea Jobs según un horario periódico en formato cron." }
  - { id: init-container, term: Init container, match: [init container, init containers], definition: "A container that runs to completion before the app containers of a Pod start.", es: "Contenedor que se ejecuta y termina antes de que arranquen los contenedores de la app." }
  - { id: sidecar, term: Sidecar, match: [sidecar, sidecars], definition: "A helper container that runs next to the main container in the same Pod.", es: "Contenedor auxiliar que corre junto al principal en el mismo Pod." }
  - { id: request, term: Request (resources), match: [requests, request], definition: "The amount of CPU or memory reserved for a container; the scheduler uses it to place Pods.", es: "CPU o memoria reservada para un contenedor; el scheduler la usa para ubicar Pods." }
  - { id: limit, term: Limit (resources), match: [limit, limits], definition: "The maximum CPU or memory a container may use. Over the memory limit the container is killed.", es: "Máximo de CPU o memoria que puede usar un contenedor." }
  - { id: qos, term: QoS class, match: [QoS, Guaranteed, Burstable, BestEffort], definition: "Guaranteed, Burstable or BestEffort, based on requests and limits; affects eviction order.", es: "Clase de calidad de servicio según requests y limits; define el orden de desalojo." }
  - { id: taint, term: Taint, match: [taint, taints, tainted], definition: "A mark on a node that repels Pods that do not tolerate it.", es: "Marca en un nodo que rechaza Pods sin la tolerancia correspondiente." }
  - { id: toleration, term: Toleration, match: [toleration, tolerations], definition: "A setting on a Pod that allows it to be scheduled on nodes with matching taints.", es: "Permite que un Pod se ubique en nodos con un taint compatible." }
  - { id: affinity, term: Affinity, match: [affinity, anti-affinity, nodeSelector], definition: "Rules that attract Pods to certain nodes, or to or away from other Pods.", es: "Reglas que acercan o alejan Pods de ciertos nodos u otros Pods." }
  - { id: coredns, term: CoreDNS, match: [DNS, CoreDNS], definition: "The DNS server of the cluster; it gives names to Services and Pods.", es: "Servidor DNS del clúster que da nombres a Services y Pods." }
  - { id: headless-service, term: Headless Service, match: [headless Service, headless], definition: "A Service with clusterIP None; DNS returns the Pod IPs directly.", es: "Service sin IP virtual; el DNS devuelve directamente las IP de los Pods." }
  - { id: gateway-api, term: Gateway API, match: [Gateway API], definition: "A set of role-oriented APIs for traffic routing, the successor of Ingress.", es: "APIs de enrutamiento de tráfico orientadas a roles; sucesor de Ingress." }
  - { id: endpointslice, term: EndpointSlice, match: [EndpointSlice, EndpointSlices, endpoints], definition: "An object that lists the IPs and ports of the Pods behind a Service.", es: "Objeto que lista las IP y puertos de los Pods detrás de un Service." }
  - { id: network-policy, term: NetworkPolicy, match: [NetworkPolicy, NetworkPolicies], definition: "Rules that control which traffic is allowed to and from Pods.", es: "Reglas que controlan qué tráfico se permite hacia y desde los Pods." }
  - { id: volume, term: Volume, match: [volume, volumes, emptyDir], definition: "A directory available to the containers of a Pod, which can outlive container restarts.", es: "Directorio disponible para los contenedores de un Pod." }
  - { id: persistent-volume, term: PersistentVolume, match: [PersistentVolume, PersistentVolumes, PV], definition: "A piece of storage in the cluster with a lifecycle independent of any Pod.", es: "Almacenamiento del clúster con ciclo de vida independiente de los Pods." }
  - { id: pvc, term: PersistentVolumeClaim, match: [PersistentVolumeClaim, PersistentVolumeClaims, PVC, claim], definition: "A request for storage by a user; it binds to a PersistentVolume.", es: "Solicitud de almacenamiento que se enlaza a un PersistentVolume." }
  - { id: storage-class, term: StorageClass, match: [StorageClass, StorageClasses], definition: "Describes a type of storage and the provisioner that creates volumes dynamically.", es: "Describe un tipo de almacenamiento y el aprovisionador que crea volúmenes." }
  - { id: service-account, term: ServiceAccount, match: [ServiceAccount, ServiceAccounts], definition: "An identity for processes running in Pods when they call the Kubernetes API.", es: "Identidad de los procesos de un Pod ante la API de Kubernetes." }
  - { id: admission-controller, term: Admission controller, match: [admission control, admission controllers, admission], definition: "Code that can modify or reject API requests after authentication and authorization.", es: "Código que puede modificar o rechazar peticiones a la API tras la autorización." }
  - { id: pod-security, term: Pod Security Standards, match: [Pod Security Standards, Pod Security], definition: "Three policy levels (Privileged, Baseline, Restricted) for Pod security settings.", es: "Tres niveles de política de seguridad para Pods." }
  - { id: security-context, term: securityContext, match: [securityContext, non-root, runAsNonRoot], definition: "Pod or container settings for privileges, user IDs and capabilities.", es: "Configuración de privilegios, usuarios y capacidades de un Pod o contenedor." }
  - { id: static-pod, term: Static Pod, match: [static Pod, static Pods], definition: "A Pod run by the kubelet from a file on the node, without the API server.", es: "Pod que ejecuta el kubelet desde un archivo del nodo, sin la API." }
  - { id: kubeconfig, term: kubeconfig, match: [kubeconfig], definition: "A file with clusters, users and contexts that kubectl uses to connect.", es: "Archivo con clústeres, usuarios y contextos que usa kubectl." }
  - { id: crd, term: CustomResourceDefinition, match: [CustomResourceDefinition, CRD, CRDs, custom resource, custom resources], definition: "Adds a new resource type to the Kubernetes API.", es: "Agrega un nuevo tipo de recurso a la API de Kubernetes." }
  - { id: operator, term: Operator, match: [Operator, Operators], definition: "Software that uses custom resources and a controller to automate running an application.", es: "Software que automatiza la operación de una aplicación con recursos propios y un controlador." }
  - { id: image, term: Image, match: [image, images], definition: "A read-only package with an application and its dependencies, used to start containers.", es: "Paquete de solo lectura con una aplicación y sus dependencias." }
  - { id: registry, term: Registry, match: [registry, registries], definition: "A service that stores and distributes container images.", es: "Servicio que almacena y distribuye imágenes de contenedores." }
  - { id: digest, term: Digest, match: [digest], definition: "A content hash (sha256) that identifies an exact image version.", es: "Hash del contenido que identifica una versión exacta de una imagen." }
  - { id: oci, term: OCI, match: [OCI, Open Container Initiative], definition: "Open Container Initiative: open standards for images, runtimes and distribution.", es: "Estándares abiertos para imágenes, runtimes y distribución de contenedores." }
  - { id: runc, term: runc, match: [runc], definition: "A low-level OCI runtime that creates and runs containers.", es: "Runtime OCI de bajo nivel que crea y ejecuta contenedores." }
  - { id: cgroups, term: cgroups, match: [cgroups, control groups], definition: "A Linux kernel feature that limits and measures CPU, memory and I/O of processes.", es: "Función del kernel Linux que limita y mide CPU, memoria y E/S." }
  - { id: cni, term: CNI, match: [CNI, Container Network Interface, CNI plugin, network plugin], definition: "Container Network Interface: the standard for plugins that set up Pod networking.", es: "Estándar para plugins que configuran la red de los Pods." }
  - { id: csi, term: CSI, match: [CSI, Container Storage Interface], definition: "Container Storage Interface: the standard for storage drivers.", es: "Estándar para drivers de almacenamiento." }
  - { id: service-mesh, term: Service mesh, match: [service mesh, service meshes, mesh], definition: "An infrastructure layer of proxies that manages traffic, security and telemetry between services.", es: "Capa de proxies que gestiona tráfico, seguridad y telemetría entre servicios." }
  - { id: mtls, term: mTLS, match: [mTLS, mutual TLS], definition: "Mutual TLS: both client and server prove their identity with certificates.", es: "TLS mutuo: cliente y servidor se autentican con certificados." }
  - { id: pdb, term: PodDisruptionBudget, match: [PodDisruptionBudget, PDB], definition: "Limits how many Pods of an application can be down at once during voluntary disruptions.", es: "Limita cuántos Pods pueden caer a la vez en interrupciones voluntarias." }
  - { id: eviction, term: Eviction, match: [evict, evicts, evicted, eviction, preempt], definition: "Stopping and removing Pods from a node, for example to free resources.", es: "Desalojo: sacar Pods de un nodo, por ejemplo para liberar recursos." }
  - { id: drain, term: Drain, match: [drain, drained], definition: "Safely evicting all Pods from a node before maintenance.", es: "Vaciar un nodo desalojando sus Pods antes de un mantenimiento." }
  - { id: cordon, term: Cordon, match: [cordon, cordons, uncordon], definition: "Marking a node as unschedulable so no new Pods are placed on it.", es: "Marcar un nodo para que no reciba nuevos Pods." }
  - { id: cluster-autoscaler, term: Cluster autoscaler, match: [cluster autoscaler, add nodes], definition: "Adds or removes nodes based on Pods that cannot be scheduled and on node usage.", es: "Agrega o quita nodos según la demanda." }
  - { id: vpa, term: VPA, match: [Vertical Pod Autoscaler, VPA], definition: "Vertical Pod Autoscaler: adjusts the requests of containers based on usage.", es: "Ajusta los requests de los contenedores según su uso." }
  - { id: keda, term: KEDA, match: [KEDA], definition: "Kubernetes Event-driven Autoscaling: scales workloads on events, including to zero.", es: "Escalado basado en eventos, incluso a cero." }
  - { id: serverless, term: Serverless, match: [serverless], definition: "Running code without managing servers; the platform scales it automatically.", es: "Ejecutar código sin gestionar servidores; la plataforma escala sola." }
  - { id: ci-cd, term: CI/CD, match: [Continuous Integration, Continuous Delivery, Continuous Deployment, CI pipeline, CI], definition: "Practices and pipelines that build, test and release software automatically and often.", es: "Prácticas y pipelines para compilar, probar y liberar software de forma automática." }
  - { id: canary, term: Canary, match: [canary], definition: "Releasing a new version to a small share of traffic first.", es: "Liberar una versión nueva primero a una pequeña parte del tráfico." }
  - { id: blue-green, term: Blue-green, match: [blue-green], definition: "Running two environments and switching all traffic from the old to the new one at once.", es: "Dos entornos; el tráfico se cambia del antiguo al nuevo de una vez." }
  - { id: kustomize, term: Kustomize, match: [Kustomize], definition: "A tool built into kubectl that customizes plain YAML with overlays and patches.", es: "Herramienta integrada en kubectl que personaliza YAML con overlays y parches." }
  - { id: iac, term: Infrastructure as Code, match: [Infrastructure as Code, IaC], definition: "Managing infrastructure through versioned configuration files.", es: "Gestionar infraestructura con archivos de configuración versionados." }
  - { id: cncf, term: CNCF, match: [CNCF], definition: "Cloud Native Computing Foundation: the foundation that hosts Kubernetes and many cloud native projects.", es: "Fundación que alberga Kubernetes y muchos proyectos cloud native." }
  - { id: microservices, term: Microservices, match: [microservices, monolith], definition: "An architecture of small, independent services that communicate over the network.", es: "Arquitectura de servicios pequeños e independientes que se comunican por red." }
  - { id: logs, term: Logs, match: [logs, logging], definition: "Timestamped text records of events produced by applications and systems.", es: "Registros de eventos con marca de tiempo." }
  - { id: trace, term: Trace, match: [trace, traces, tracing], definition: "The record of a request's path through several services, made of spans.", es: "Registro del recorrido de una petición por varios servicios." }
  - { id: span, term: Span, match: [span, spans], definition: "One operation inside a trace, with a start time and duration.", es: "Una operación dentro de una traza, con inicio y duración." }
  - { id: opentelemetry, term: OpenTelemetry, match: [OpenTelemetry], definition: "A vendor-neutral standard and toolkit for traces, metrics and logs.", es: "Estándar abierto y herramientas para trazas, métricas y logs." }
  - { id: alertmanager, term: Alertmanager, match: [Alertmanager], definition: "Prometheus component that groups, silences and routes alerts.", es: "Componente de Prometheus que agrupa, silencia y enruta alertas." }
  - { id: sli, term: SLI, match: [SLI], definition: "Service Level Indicator: a measurement of how well a service performs.", es: "Indicador de nivel de servicio: una medición." }
  - { id: slo, term: SLO, match: [SLO], definition: "Service Level Objective: the target value for an SLI.", es: "Objetivo de nivel de servicio: la meta para un SLI." }
  - { id: sla, term: SLA, match: [SLA], definition: "Service Level Agreement: a commitment to customers, often with penalties.", es: "Acuerdo de nivel de servicio con clientes, a menudo con penalidades." }
  - { id: finops, term: FinOps, match: [FinOps], definition: "A practice to understand and optimize cloud costs across finance and engineering.", es: "Práctica para entender y optimizar costos cloud." }
