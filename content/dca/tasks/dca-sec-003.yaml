id: dca-sec-003
title: Give a service a secret and a config
domain: security
difficulty: 2
minutes: 10
environment: docker
setup: |
  [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || docker swarm init >/dev/null
  mkdir -p /lab/vault
  printf 'listen=8200\nlog_level=info\n' > /lab/vault/app.conf
task: |
  A service needs a database password and a configuration file. Never put the password in an
  environment variable or in the image.

  1. Create a swarm **secret** `db_password` with the value `S3cr3t-Lab` (no newline at the end).
  2. Create a swarm **config** `app_config` from the file `/lab/vault/app.conf`.
  3. Create a service `vault-app` (1 replica, image `busybox:1.36`, command `sleep 1d`) that gets:
     - the secret at its default path `/run/secrets/db_password`;
     - the config at `/etc/app/app.conf`.
checks:
  - name: Secret `db_password` and config `app_config` exist
    run: docker secret inspect db_password >/dev/null && docker config inspect app_config >/dev/null
  - name: '`vault-app` uses the secret and the config at the right paths'
    run: |
      out=$(docker service inspect vault-app) || exit 1
      echo "$out" | jq -e '.[0].Spec.TaskTemplate.ContainerSpec
        | ([.Secrets[]? | select(.SecretName == "db_password" and (.File.Name == "db_password" or .File.Name == "/run/secrets/db_password"))] | length == 1)
          and ([.Configs[]? | select(.ConfigName == "app_config" and .File.Name == "/etc/app/app.conf")] | length == 1)' >/dev/null
  - name: The running task reads the password and the config file
    run: |
      id=$(docker ps -q --filter label=com.docker.swarm.service.name=vault-app | head -1)
      [ -n "$id" ] || exit 1
      [ "$(docker exec "$id" cat /run/secrets/db_password)" = S3cr3t-Lab ] || exit 1
      docker exec "$id" grep -q 'listen=8200' /etc/app/app.conf
  - name: The password is not in the environment of the service
    run: |
      out=$(docker service inspect vault-app) || exit 1
      ! echo "$out" | grep -q 'S3cr3t-Lab'
solution: |
  printf 'S3cr3t-Lab' | docker secret create db_password -
  docker config create app_config /lab/vault/app.conf
  docker service create --name vault-app \
    --secret db_password \
    --config source=app_config,target=/etc/app/app.conf \
    busybox:1.36 sleep 1d
  id=$(docker ps -q --filter label=com.docker.swarm.service.name=vault-app)
  docker exec "$id" cat /run/secrets/db_password      # mounted in memory (tmpfs) only
  docker exec "$id" cat /etc/app/app.conf
  # Secrets are encrypted in the Raft log and only sent to nodes that run a task that uses them.
docs:
  - https://docs.docker.com/engine/swarm/secrets/
  - https://docs.docker.com/engine/swarm/configs/
