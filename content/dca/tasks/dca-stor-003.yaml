id: dca-stor-003
title: Back up and restore a volume
domain: storage
difficulty: 2
minutes: 10
environment: docker
setup: |
  docker volume create cms-data >/dev/null
  docker run --rm -v cms-data:/data alpine:3.20 sh -c 'mkdir -p /data/uploads && echo logo > /data/uploads/logo.txt && echo cfg > /data/site.conf'
  mkdir -p /lab/backup
task: |
  The volume `cms-data` holds the files of a CMS (`site.conf` and `uploads/logo.txt`).

  1. Back up the **content** of the volume to the compressed archive
     `/lab/backup/cms-data.tar.gz` (`/lab` is shared with the Docker host, so you can bind-mount
     `/lab/backup` into a helper container).
  2. Create a new volume `cms-data-restore` and **restore** the archive into it, so it has
     `site.conf` and `uploads/logo.txt` at its root.
checks:
  - name: The archive has site.conf and uploads/logo.txt
    run: |
      out=$(tar -tzf /lab/backup/cms-data.tar.gz 2>&1) || exit 1
      list=$(echo "$out" | sed -e 's#^\./##' -e 's#^data/##')
      echo "$list" | grep -qx 'site.conf' && echo "$list" | grep -qx 'uploads/logo.txt'
  - name: Volume `cms-data-restore` has the files at its root
    run: |
      out=$(docker run --rm -v cms-data-restore:/r:ro alpine:3.20 sh -c 'cat /r/site.conf /r/uploads/logo.txt' 2>&1) || exit 1
      [ "$out" = "$(printf 'cfg\nlogo')" ]
  - name: The original volume `cms-data` still has its files
    run: docker run --rm -v cms-data:/d:ro alpine:3.20 test -f /d/uploads/logo.txt
    guard: true
solution: |
  # back up: one helper container sees the volume and the backup folder
  docker run --rm -v cms-data:/data:ro -v /lab/backup:/backup alpine:3.20 \
    tar czf /backup/cms-data.tar.gz -C /data .
  tar -tzf /lab/backup/cms-data.tar.gz
  # restore into a new volume
  docker volume create cms-data-restore
  docker run --rm -v cms-data-restore:/data -v /lab/backup:/backup:ro alpine:3.20 \
    tar xzf /backup/cms-data.tar.gz -C /data
  docker run --rm -v cms-data-restore:/r alpine:3.20 ls -R /r
docs:
  - https://docs.docker.com/engine/storage/volumes/#back-up-restore-or-migrate-data-volumes
