id: dca-orch-004
title: Fix a service whose tasks stay pending
domain: orchestration
difficulty: 3
minutes: 10
environment: docker
setup: |
  [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || docker swarm init >/dev/null
  docker service create -d -q --name report-gen --replicas 2 \
    --constraint node.labels.disk==ssd --reserve-memory 500G \
    busybox:1.36 sleep 1d >/dev/null
  docker service inspect -f "{{.ID}}" report-gen > /var/tmp/dca-orch-004.id
task: |
  The service `report-gen` was created a while ago, but **no task ever started**.

  Find out why (`docker service ps --no-trunc` and `docker service inspect --pretty` help) and
  fix it so that **2 tasks run**. Keep the intent of the team:
  - the tasks must only run on nodes with the label `disk=ssd` (the node of this swarm **does**
    have an SSD disk, so it may carry that label);
  - someone typed the memory reservation as `500G` instead of **`64M`**.

  Do not delete and re-create the service: update it.
checks:
  - name: 2 tasks of `report-gen` are running
    run: |
      out=$(docker service ps report-gen --filter desired-state=running --format '{{.CurrentState}}') || exit 1
      [ "$(echo "$out" | grep -c '^Running')" = 2 ]
  - name: The memory reservation is 64 MiB
    run: '[ "$(docker service inspect -f "{{.Spec.TaskTemplate.Resources.Reservations.MemoryBytes}}" report-gen)" = 67108864 ]'
  - name: The node has the label `disk=ssd`
    run: '[ "$(docker node inspect self -f "{{index .Spec.Labels \"disk\"}}")" = ssd ]'
  - name: The service still has the constraint `node.labels.disk==ssd`
    run: |
      out=$(docker service inspect report-gen) || exit 1
      echo "$out" | jq -e '[.[0].Spec.TaskTemplate.Placement.Constraints[]? | gsub(" "; "")] | index("node.labels.disk==ssd") != null' >/dev/null
    guard: true
  - name: It is the same service (it was updated, not re-created)
    run: '[ "$(docker service inspect -f "{{.ID}}" report-gen)" = "$(cat /var/tmp/dca-orch-004.id)" ]'
    guard: true
solution: |
  docker service ps --no-trunc report-gen
  #   ERROR column: "no suitable node (scheduling constraints not satisfied on 1 node;
  #                  insufficient resources on 1 node)"
  docker service inspect --pretty report-gen
  docker node update --label-add disk=ssd "$(docker node ls -q)"   # or the node hostname
  docker service update --reserve-memory 64M report-gen
  docker service ps report-gen
docs:
  - https://docs.docker.com/engine/swarm/services/#placement-constraints
  - https://docs.docker.com/engine/swarm/services/#reserve-memory-or-cpus-for-a-service
  - https://docs.docker.com/reference/cli/docker/service/update/
