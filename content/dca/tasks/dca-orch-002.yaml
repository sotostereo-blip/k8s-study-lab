id: dca-orch-002
title: Global service placed by a node label
domain: orchestration
difficulty: 2
minutes: 8
environment: docker
setup: |
  [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || docker swarm init >/dev/null
task: |
  The swarm needs a monitoring agent on **every** node of the edge zone.

  1. Add the node label `zone=edge` to the swarm node (the only node, see `docker node ls`).
  2. Create a service `node-agent`:
     - image `busybox:1.36`, command `sleep 1d`;
     - **global** mode (one task on every node that matches);
     - a placement constraint so it only runs on nodes with the label `zone=edge`.
checks:
  - name: The node has the label `zone=edge`
    run: '[ "$(docker node inspect self -f "{{index .Spec.Labels \"zone\"}}")" = edge ]'
  - name: Service `node-agent` runs in global mode
    run: |
      out=$(docker service inspect node-agent) || exit 1
      echo "$out" | jq -e '.[0].Spec.Mode | has("Global")' >/dev/null
  - name: The service has the constraint `node.labels.zone==edge`
    run: |
      out=$(docker service inspect node-agent) || exit 1
      echo "$out" | jq -e '[.[0].Spec.TaskTemplate.Placement.Constraints[]? | gsub(" "; "")] | index("node.labels.zone==edge") != null' >/dev/null
  - name: One task of `node-agent` is running
    run: |
      out=$(docker service ps node-agent --filter desired-state=running --format '{{.CurrentState}}') || exit 1
      [ "$(echo "$out" | grep -c '^Running')" = 1 ]
solution: |
  docker node ls                                     # the ID or HOSTNAME of the node
  docker node update --label-add zone=edge "$(docker node ls -q)"   # one node here
  docker service create --name node-agent --mode global \
    --constraint node.labels.zone==edge busybox:1.36 sleep 1d
  docker service ps node-agent
  # A node label is set by managers (docker node update). An engine label (daemon.json "labels")
  # is set on each host and is matched with node.platform/engine.labels instead.
docs:
  - https://docs.docker.com/engine/swarm/services/#placement-constraints
  - https://docs.docker.com/engine/swarm/manage-nodes/#add-or-remove-label-metadata
  - https://docs.docker.com/reference/cli/docker/service/create/#constraint
