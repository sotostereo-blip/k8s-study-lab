domain: cloud-native-architecture
questions:
  - id: kcna-arch-001
    difficulty: 2
    type: single
    question: What does the Horizontal Pod Autoscaler (HPA) change when load increases?
    options:
      - id: a
        text: "The CPU and memory limits of the existing Pods"
        why: "Changing CPU and memory requests or limits is vertical scaling. That is the job of the Vertical Pod Autoscaler (VPA), not the HPA."
      - id: b
        text: "The number of nodes in the cluster node pool"
        why: "Adding or removing nodes is done by a cluster autoscaler. The HPA only works with Pods; it never changes the nodes of the cluster."
      - id: c
        text: "The number of Pod replicas of a workload"
      - id: d
        text: "The image version used by the containers"
        why: "The image version changes when you update the Pod template, for example in a rollout. Autoscalers do not change images."
    answer: [c]
    explanation: |
      The HPA scales horizontally: it adjusts the replica count based on
      metrics such as CPU utilization or custom metrics. Changing requests and
      limits is vertical scaling (VPA), and adding nodes is the job of a
      cluster autoscaler.
    docs:
      - https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
    glossary: [hpa, replica, deployment]

  - id: kcna-arch-002
    difficulty: 2
    type: single
    question: How does Prometheus usually collect metrics from applications?
    options:
      - id: a
        text: "Applications push their metrics to Prometheus over HTTP."
        why: "Prometheus does not wait for apps to push data. Push is only an exception for short-lived jobs, using the Pushgateway."
      - id: b
        text: "Prometheus scrapes (pulls) metrics from HTTP endpoints."
      - id: c
        text: "Prometheus reads Pod metrics directly from etcd."
        why: "etcd stores the state of Kubernetes objects, not application metrics. Prometheus never reads etcd to get Pod metrics."
      - id: d
        text: "Prometheus parses container logs to calculate metrics."
        why: "Prometheus does not parse logs. It reads metrics that targets expose in its text format; logs are handled by tools like Loki."
    answer: [b]
    explanation: |
      Prometheus uses a pull model: at a regular interval it scrapes an HTTP
      endpoint (often /metrics) on each target. For short-lived jobs that
      cannot be scraped, a Pushgateway can be used as an exception.
    docs:
      - https://prometheus.io/docs/introduction/overview/
    glossary: [prometheus, observability, metrics]

  - id: kcna-arch-003
    difficulty: 1
    type: single
    question: >-
      According to the CNCF definition, which technologies are typical of the cloud native approach?
    options:
      - id: a
        text: "Mainframes, batch jobs and nightly scripts run by operators"
        why: "Mainframes and nightly scripts run by hand are traditional IT. Cloud native is about automation and dynamic, loosely coupled systems."
      - id: b
        text: "Containers, service meshes, microservices and declarative APIs"
      - id: c
        text: "Large virtual machines that are configured and patched by hand"
        why: "Manual configuration and patching is the opposite of cloud native. The CNCF approach uses automation and immutable infrastructure."
      - id: d
        text: "A single shared database and a monolithic application server"
        why: "A monolith with one shared database is a tightly coupled design. The CNCF definition talks about loosely coupled systems like microservices."
    answer: [b]
    explanation: |
      The CNCF definition says these techniques enable loosely coupled systems
      that are resilient, manageable and observable, and that let engineers make
      high-impact changes frequently and predictably.
    docs:
      - https://github.com/cncf/toc/blob/main/DEFINITION.md
    glossary: [microservices, service-mesh]

  - id: kcna-arch-004
    difficulty: 1
    type: single
    question: >-
      What are the three maturity levels of CNCF projects?
    options:
      - id: a
        text: "Alpha, Beta and Stable, like Kubernetes API versions"
        why: "Alpha, Beta and Stable are levels of Kubernetes APIs and features. CNCF projects use different maturity levels."
      - id: b
        text: "Bronze, Silver and Gold, based on the number of users"
        why: "The CNCF does not use Bronze, Silver and Gold for project maturity. Maturity depends on adoption, community and governance, not only user count."
      - id: c
        text: "Sandbox, Incubating and Graduated"
      - id: d
        text: "Draft, Candidate and Final, decided by public vote"
        why: "Draft, Candidate and Final are not CNCF project levels, and maturity is not decided by a public vote. The TOC decides."
    answer: [c]
    explanation: |
      Projects enter as Sandbox, move to Incubating as adoption grows, and become
      Graduated when they show wide adoption, a healthy community and good
      governance. Kubernetes was the first graduated project.
    docs:
      - https://www.cncf.io/projects/
    glossary: [cncf]

  - id: kcna-arch-005
    difficulty: 2
    type: single
    question: >-
      Which group in the CNCF approves projects and decides on their maturity level?
    options:
      - id: a
        text: "The Technical Oversight Committee (TOC)"
      - id: b
        text: "The Kubernetes release team and SIG leads"
        why: "The Kubernetes release team and SIGs work only on Kubernetes. They do not accept projects into the CNCF or set their level."
      - id: c
        text: "The CNCF Governing Board of member companies"
        why: "The Governing Board handles budget, marketing and business matters. Technical decisions about projects belong to the TOC."
      - id: d
        text: "The Linux Foundation legal team"
        why: "The Linux Foundation legal team handles legal topics like trademarks and licenses. It does not judge the technical maturity of projects."
    answer: [a]
    explanation: |
      The TOC is the technical governing body of the CNCF. Within Kubernetes
      itself, Special Interest Groups (SIGs) own different areas such as
      networking, storage or node.
    docs:
      - https://github.com/cncf/toc
    glossary: [cncf]

  - id: kcna-arch-006
    difficulty: 2
    type: single
    question: >-
      What is an advantage of a microservices architecture compared with a monolith?
    options:
      - id: a
        text: "It is simpler to operate, because there are fewer moving parts"
        why: "Microservices add moving parts: many services, networks and deployments. They are usually harder to operate than a monolith."
      - id: b
        text: "It removes network calls, because all code runs in one process"
        why: "Microservices talk to each other over the network. Running all code in one process describes a monolith, not microservices."
      - id: c
        text: "It forces every service to share one database, so data is consistent"
        why: "Microservices usually give each service its own data. Forcing one shared database couples the services, which goes against this design."
      - id: d
        text: "Teams can develop, deploy and scale each service independently"
    answer: [d]
    explanation: |
      Microservices give independence and flexible scaling, but add complexity:
      network calls, distributed data and the need for good observability. A
      monolith can be the better choice for small teams.
    docs:
      - https://github.com/cncf/toc/blob/main/DEFINITION.md
    glossary: [microservices]

  - id: kcna-arch-007
    difficulty: 2
    type: single
    question: >-
      What does "serverless" usually mean in cloud native computing?
    options:
      - id: a
        text: "You deploy code without managing servers, and it scales automatically"
      - id: b
        text: "Applications run on end-user devices instead of in a data center"
        why: "Running apps on user devices is closer to edge or client-side computing. Serverless code still runs in the cloud provider's data centers."
      - id: c
        text: "Kubernetes clusters run without a control plane or an etcd database"
        why: "Every Kubernetes cluster needs a control plane and a data store. Serverless means the platform hides servers from you, not that they are missing."
      - id: d
        text: "Each function runs on its own dedicated physical server for isolation"
        why: "Serverless platforms share infrastructure and start functions on demand. A dedicated physical server per function would be slow and expensive."
    answer: [a]
    explanation: |
      Servers still exist, but the platform hides them. You pay or use resources
      only when requests arrive. Knative is a popular project that brings
      serverless workloads to Kubernetes.
    docs:
      - https://knative.dev/docs/
    glossary: [serverless]

  - id: kcna-arch-008
    difficulty: 1
    type: single
    question: >-
      Which three kinds of telemetry are often called the pillars or signals of observability?
    options:
      - id: a
        text: "CPU, memory, disk"
        why: "CPU, memory and disk are resources you can measure. They are examples of metrics, only one of the three signals."
      - id: b
        text: "Metrics, logs and traces"
      - id: c
        text: "Pods, Services, Ingresses"
        why: "Pods, Services and Ingresses are Kubernetes objects, not kinds of telemetry data."
      - id: d
        text: "Alerts, tickets, dashboards"
        why: "Alerts, tickets and dashboards are ways to use or show telemetry. They are not the telemetry signals themselves."
    answer: [b]
    explanation: |
      Metrics are numbers over time, logs are records of events, and traces show
      the path of a request through many services. Using them together helps you
      understand why a system behaves the way it does.
    docs:
      - https://opentelemetry.io/docs/concepts/signals/
    glossary: [observability, metrics, logs, trace]

  - id: kcna-arch-009
    difficulty: 2
    type: single
    question: >-
      What is OpenTelemetry?
    options:
      - id: a
        text: "A time-series database that stores metrics and evaluates alert rules"
        why: "This describes Prometheus. OpenTelemetry does not store data or evaluate alert rules; it produces and sends telemetry to backends."
      - id: b
        text: "A dashboard tool that draws graphs from many data sources"
        why: "This describes Grafana. OpenTelemetry does not draw dashboards; it standardizes how telemetry is created and exported."
      - id: c
        text: "A vendor-neutral set of APIs, SDKs and tools for traces, metrics and logs"
      - id: d
        text: "A log shipper that runs as a DaemonSet on every node"
        why: "This describes tools like Fluent Bit. OpenTelemetry covers traces, metrics and logs, and is not just a log shipper."
    answer: [c]
    explanation: |
      OpenTelemetry standardizes how telemetry is produced and sent. You
      instrument once and can send data to many backends, such as Prometheus,
      Jaeger or commercial tools, often through the OpenTelemetry Collector.
    docs:
      - https://opentelemetry.io/docs/what-is-opentelemetry/
    glossary: [opentelemetry, trace]

  - id: kcna-arch-010
    difficulty: 2
    type: single
    question: >-
      In distributed tracing, what is a span?
    options:
      - id: a
        text: "One operation inside a trace, with a start time and duration"
      - id: b
        text: "A log line that contains the request ID of an HTTP call"
        why: "A log line with a request ID is a log record, not a span. A span has its own start time, duration and place in a trace."
      - id: c
        text: "The time window Prometheus uses to calculate a rate"
        why: "This is the range in a PromQL function like rate(). It is a metrics concept, not part of distributed tracing."
      - id: d
        text: "A group of alert rules that are evaluated together"
        why: "A group of alert rules is a Prometheus rule group. It has nothing to do with tracing."
    answer: [a]
    explanation: |
      A trace is a tree of spans. Each span represents one operation, such as an
      HTTP call or a database query, so you can see where the time of a request
      is spent.
    docs:
      - https://opentelemetry.io/docs/concepts/signals/traces/
    glossary: [trace, span]

  - id: kcna-arch-011
    difficulty: 2
    type: single
    question: >-
      Kubernetes does not store container logs long-term. What is a common pattern to collect them?
    options:
      - id: a
        text: "Configure the API server to save all container logs in etcd"
        why: "etcd stores cluster state and is small and sensitive. The API server does not save container logs there, and doing so would overload etcd."
      - id: b
        text: "Run kubectl logs from a CronJob and save the output to a ConfigMap"
        why: "ConfigMaps hold small configuration data (up to 1 MiB). Copying logs into them with kubectl is not scalable or reliable."
      - id: c
        text: "Mount a PersistentVolume in each Pod and keep logs there forever"
        why: "Apps should write logs to stdout and stderr. A volume per Pod is hard to search and manage, so it is not the usual pattern."
      - id: d
        text: "Run a logging agent as a DaemonSet that ships logs to a backend"
    answer: [d]
    explanation: |
      Containers write to stdout and stderr, and the runtime saves them on the
      node. A logging agent on each node reads those files and forwards them, so
      logs survive Pod and node deletion.
    docs:
      - https://kubernetes.io/docs/concepts/cluster-administration/logging/
    glossary: [logs, daemonset]

  - id: kcna-arch-012
    difficulty: 2
    type: single
    question: >-
      Which component of the Prometheus ecosystem groups, silences and routes alerts to channels such as email or chat?
    options:
      - id: a
        text: "Pushgateway"
        why: "The Pushgateway lets short-lived jobs push metrics so Prometheus can scrape them. It does not handle alerts."
      - id: b
        text: "Alertmanager"
      - id: c
        text: "node_exporter"
        why: "node_exporter exposes hardware and OS metrics of a node for Prometheus to scrape. It does not route alerts."
      - id: d
        text: "PromQL"
        why: "PromQL is the query language of Prometheus. Alert rules use it, but it does not group, silence or send notifications."
    answer: [b]
    explanation: |
      Prometheus evaluates alerting rules and sends firing alerts to
      Alertmanager, which handles deduplication, grouping, silencing and
      notification routing.
    docs:
      - https://prometheus.io/docs/alerting/latest/alertmanager/
    glossary: [prometheus, alertmanager]

  - id: kcna-arch-013
    difficulty: 3
    type: single
    question: >-
      What is the difference between an SLI and an SLO?
    options:
      - id: a
        text: "An SLI is an agreement with customers; an SLO is the penalty if it fails"
        why: "An agreement with customers, often with penalties, is an SLA. An SLI is a measurement and an SLO is an internal target."
      - id: b
        text: "An SLI is measured by the cloud provider; an SLO is measured by the app"
        why: "SLIs and SLOs are not defined by who measures them. The SLI is the measurement and the SLO is the target for it."
      - id: c
        text: "An SLI is what you measure, such as success rate; an SLO is its target"
      - id: d
        text: "An SLO is a type of alert; an SLI is the dashboard that shows it"
        why: "An SLO is a target, not an alert, and an SLI is a measurement, not a dashboard. Alerts and dashboards can use them."
    answer: [c]
    explanation: |
      SLI = indicator (what you measure). SLO = objective (the target). An SLA is
      an agreement with customers that often includes consequences if the
      objective is not met.
    docs:
      - https://sre.google/sre-book/service-level-objectives/
    glossary: [sli, slo, sla]

  - id: kcna-arch-014
    difficulty: 2
    type: single
    question: >-
      kubectl top pods returns an error that metrics are not available. What is most likely missing?
    options:
      - id: a
        text: "metrics-server"
      - id: b
        text: "Grafana"
        why: "Grafana shows graphs from data sources like Prometheus. kubectl top does not use Grafana; it uses the Metrics API."
      - id: c
        text: "An Ingress controller"
        why: "An Ingress controller routes external HTTP traffic to Services. It does not provide CPU or memory metrics."
      - id: d
        text: "A StorageClass"
        why: "A StorageClass describes how volumes are provisioned. It has nothing to do with Pod resource metrics."
    answer: [a]
    explanation: |
      metrics-server collects CPU and memory usage from the kubelets and exposes
      it through the Metrics API. kubectl top and the HPA use this API.
    docs:
      - https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/
    glossary: [metrics, hpa]

  - id: kcna-arch-015
    difficulty: 2
    type: single
    question: >-
      What is FinOps?
    options:
      - id: a
        text: "A Kubernetes scheduler plugin that places Pods on the cheapest nodes"
        why: "FinOps is not a piece of software. It is a practice and culture; tools may help, but no scheduler plugin is FinOps."
      - id: b
        text: "A security standard for financial applications running in the cloud"
        why: "FinOps is about managing cloud cost, not about security for financial apps. Security standards are a different topic."
      - id: c
        text: "A logging format that adds cost information to every log line"
        why: "FinOps is not a log format. It is a practice that brings finance and engineering together around cloud spending."
      - id: d
        text: "A practice uniting finance and engineering to understand and optimize cloud cost"
    answer: [d]
    explanation: |
      In the cloud, engineers make spending decisions every day. FinOps gives
      cost visibility (for example per Namespace or team) and drives actions like
      right-sizing requests and using autoscaling.
    docs:
      - https://www.finops.org/introduction/what-is-finops/
    glossary: [finops]

  - id: kcna-arch-016
    difficulty: 2
    type: single
    question: >-
      Which of these is an example of a cloud native open standard that lets components be swapped?
    options:
      - id: a
        text: "The Container Network Interface (CNI)"
      - id: b
        text: "A vendor's private VM disk image format"
        why: "A private format owned by one vendor locks you in. An open standard is shared and lets you switch between implementations."
      - id: c
        text: "A company's internal deployment wiki"
        why: "An internal wiki is documentation, not a standard interface. Other tools cannot use it to swap components."
      - id: d
        text: "A cloud provider's proprietary load balancer API"
        why: "A proprietary API works only with one provider. It creates lock-in instead of letting you replace components."
    answer: [a]
    explanation: |
      Standards such as CNI (networking), CSI (storage), CRI (runtimes) and OCI
      (images) define clear interfaces, so you can choose and replace
      implementations without changing Kubernetes.
    docs:
      - https://www.cni.dev/
    glossary: [cni, csi, cri, oci]

  - id: kcna-arch-017
    difficulty: 3
    type: single
    question: >-
      What does it mean to treat servers as "cattle, not pets"?
    options:
      - id: a
        text: "Servers get names and are carefully repaired when something breaks"
        why: "Giving servers names and fixing them with care is the \"pets\" model. Cattle are not repaired; they are replaced."
      - id: b
        text: "Every server is configured by hand to fit its specific workload"
        why: "Configuring each server by hand makes it unique, like a pet. Cattle servers are identical and created automatically."
      - id: c
        text: "Servers are identical and replaceable; you replace one instead of fixing it"
      - id: d
        text: "Servers should never be updated, to avoid unplanned downtime"
        why: "Cattle servers are updated often, by replacing them with new versions. Never updating them would leave bugs and security holes."
    answer: [c]
    explanation: |
      This idea is the base of immutable infrastructure. Instead of patching a
      running machine or container, you build a new version and replace the old
      one, which keeps environments consistent.
    docs:
      - https://github.com/cncf/toc/blob/main/DEFINITION.md
    glossary: [immutable-infrastructure]

  - id: kcna-arch-018
    difficulty: 3
    type: multiple
    question: >-
      Which TWO statements about Prometheus are true?
    options:
      - id: a
        text: "It stores data as time series identified by a metric name and labels"
      - id: b
        text: "It uses PromQL to query data"
      - id: c
        text: "It is designed mainly to store full request traces"
        why: "Prometheus stores numeric metrics, not full request traces. Tracing is done by tools like Jaeger."
      - id: d
        text: "It requires every application to send logs over syslog"
        why: "Prometheus does not collect logs or need syslog. It scrapes metrics from HTTP endpoints."
    answer: [a, b]
    explanation: |
      Prometheus is a metrics system. Each time series is a metric name plus
      key-value labels, and PromQL lets you select and aggregate them. Tracing is
      handled by tools like Jaeger, and logs by tools like Loki or Elasticsearch.
    docs:
      - https://prometheus.io/docs/concepts/data_model/
      - https://prometheus.io/docs/prometheus/latest/querying/basics/
    glossary: [prometheus, metrics]
