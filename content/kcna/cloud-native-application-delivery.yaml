  - id: kcna-deliv-024
    difficulty: 2
    type: multiple
    question: >-
      Which TWO are benefits of storing deployment configuration in Git for GitOps?
    options:
      - id: a
        text: "A full audit history of who changed what and when"
      - id: b
        text: "Easy rollback by reverting a commit"
      - id: c
        text: "No need for tests"
        why: "Git does not replace testing. You still need CI tests; GitOps only changes how the tested configuration is deployed."
      - id: d
        text: "Containers run faster"
        why: "Where the configuration is stored does not change runtime speed. Containers run the same whether manifests come from Git or not."
    answer: [a, b]
    explanation: |
      Git gives history, review through pull requests and simple rollback. It
