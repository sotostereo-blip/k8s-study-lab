id: terraform-config-003
title: Build names and tags with locals and functions
domain: configuration
difficulty: 2
minutes: 10
environment: terraform
setup: |
  mkdir -p /root/naming-locals && cd /root/naming-locals
  cp /opt/lab/aws-provider.tf .
  cat > variables.tf <<'TF'
  variable "project" {
    type    = string
    default = "Atlas"
  }

  variable "environment" {
    type    = string
    default = "Dev"
  }

  variable "extra_tags" {
    type = map(string)
    default = {
      Owner = "platform-team"
    }
  }
  TF
  echo '# Write your locals and the bucket here' > main.tf
task: |
  Your company has rules for names and tags. Work in `/root/naming-locals`. Do not change `variables.tf`.

  1. Add a `locals` block with:
     - `name_prefix`: the project and the environment joined with `-`, in **lowercase**
       (here: `atlas-dev`). S3 bucket names cannot have capital letters.
     - `common_tags`: a map with `Project = var.project`, `Environment = var.environment`
       and `ManagedBy = "terraform"`, **merged** with `var.extra_tags`.
  2. Create an S3 bucket called `tfcfg-<name_prefix>-assets` with `tags = local.common_tags`.
  3. Apply.

  Tip: try your expressions first in `terraform console`.
checks:
  - name: The configuration uses a `locals` block
    run: grep -qE '^\s*locals\s*\{' /root/naming-locals/*.tf
  - name: The bucket `tfcfg-atlas-dev-assets` exists
    run: aws s3api head-bucket --bucket tfcfg-atlas-dev-assets
  - name: The bucket has the 4 tags Project=Atlas, Environment=Dev, ManagedBy=terraform, Owner=platform-team
    run: |
      aws s3api get-bucket-tagging --bucket tfcfg-atlas-dev-assets | jq -e '(.TagSet | from_entries) ==
        {"Project":"Atlas","Environment":"Dev","ManagedBy":"terraform","Owner":"platform-team"}' >/dev/null
  - name: '`terraform plan` shows no changes'
    run: terraform -chdir=/root/naming-locals plan -input=false -detailed-exitcode >/dev/null
solution: |
  cd /root/naming-locals
  terraform console                  # try: lower("${var.project}-${var.environment}")   (exit with Ctrl+D)
  cat > main.tf <<'TF'
  locals {
    name_prefix = lower("${var.project}-${var.environment}")   # or lower(format("%s-%s", var.project, var.environment))

    common_tags = merge(
      {
        Project     = var.project
        Environment = var.environment
        ManagedBy   = "terraform"
      },
      var.extra_tags,                # with merge, later maps win when keys repeat
    )
  }

  resource "aws_s3_bucket" "assets" {
    bucket = "tfcfg-${local.name_prefix}-assets"
    tags   = local.common_tags
  }
  TF
  terraform init
  terraform apply
  # A local value is referenced as local.<name> (singular), but declared in a "locals" block.
docs:
  - https://developer.hashicorp.com/terraform/language/values/locals
  - https://developer.hashicorp.com/terraform/language/functions/merge
  - https://developer.hashicorp.com/terraform/language/functions/lower
  - https://developer.hashicorp.com/terraform/cli/commands/console
auto_solution: |
  cd /root/naming-locals
  cat > main.tf <<'TF'
  locals {
    name_prefix = lower(format("%s-%s", var.project, var.environment))
    common_tags = merge({ Project = var.project, Environment = var.environment, ManagedBy = "terraform" }, var.extra_tags)
  }

  resource "aws_s3_bucket" "assets" {
    bucket = "tfcfg-${local.name_prefix}-assets"
    tags   = local.common_tags
  }
  TF
  terraform init -input=false
  terraform apply -auto-approve -input=false
