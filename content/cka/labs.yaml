# Hands-on labs for the CKA (Certified Kubernetes Administrator).
# Domains and weights follow the public CKA curriculum. Each task lives in tasks/<id>.yaml.
id: cka
name: Certified Kubernetes Administrator
exam_minutes: 120
passing_score: 66
domains:
  - { id: troubleshooting, name: Troubleshooting, weight: 30 }
  - { id: cluster-architecture, name: "Cluster Architecture, Installation & Configuration", weight: 25 }
  - { id: services-networking, name: Services & Networking, weight: 20 }
  - { id: workloads-scheduling, name: Workloads & Scheduling, weight: 15 }
  - { id: storage, name: Storage, weight: 10 }
environments:
  single-node: { name: "1 node (controlplane)", nodes: 1 }
  two-node: { name: "2 nodes (controlplane + node01)", nodes: 2 }
  gateway:
    name: "1 node with the Gateway API (Traefik)"
    label: "Gateway API"
    nodes: 1
    # Traefik is installed by k3s after the node is Ready: wait for the GatewayClass and Traefik
    ready: >-
      [ "$(kubectl get gatewayclass traefik -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status}' 2>/dev/null)" = True ]
      && kubectl -n kube-system rollout status deployment traefik --timeout=5s >/dev/null 2>&1
      && curl -s -o /dev/null http://server/
    ready_timeout: 420
  kubeadm:
    name: "kubeadm cluster v1.36 (controlplane; node01 not joined yet)"
    label: "kubeadm"
    nodes: 1
    tools: "kubectl is ready (alias `k`) · `ssh controlplane` · `ssh node01`"
    ready: "ssh -o ConnectTimeout=3 -n controlplane true && ssh -o ConnectTimeout=3 -n node01 true"
    ready_timeout: 420
mock_environment: two-node   # all mock exam tasks run together in one 2-node cluster
# Real exam rules (Linux Foundation "Resources Allowed", checked 2026-11). Shown in the mock exam.
exam_rules:
  docs:
    - { name: "Kubernetes Documentation", url: "https://kubernetes.io/docs/" }
    - { name: "Kubernetes Blog", url: "https://kubernetes.io/blog/" }
    - { name: "Helm Documentation", url: "https://helm.sh/docs/" }
    - { name: "Gateway API Documentation", url: "https://gateway-api.sigs.k8s.io/" }
  notes:
    - "Only one browser, inside the exam machine. Search on kubernetes.io/docs is allowed, but do not open external search results."
    - "Each task can also show task-specific links in its Quick Reference box."
    - "You may read files under /usr/share and install packages from the distribution."
  source: "https://docs.linuxfoundation.org/tc-docs/certification/certification-resources-allowed"
