id: cka-ts-008
title: App cannot find a Service in another namespace
domain: troubleshooting
difficulty: 3
minutes: 8
environment: single-node
setup: |
  kubectl create namespace backend
  kubectl -n backend create deployment inventory --image=nginx:1.27-alpine
  kubectl -n backend expose deployment inventory --port=80
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: storefront
  spec:
    replicas: 1
    selector:
      matchLabels: { app: storefront }
    template:
      metadata:
        labels: { app: storefront }
      spec:
        containers:
        - name: app
          image: busybox:1.36
          env:
          - { name: INVENTORY_URL, value: "http://inventory" }
          command: ["sh", "-c", "wget -qO- -T 3 \"$INVENTORY_URL\" >/dev/null || { echo \"cannot reach $INVENTORY_URL\"; exit 1; }; echo connected to $INVENTORY_URL; sleep 3600"]
  YAML
task: |
  The Deployment `storefront` in `default` keeps crashing. It calls the Service
  `inventory`, which runs in the namespace `backend`.

  Read the logs, find the cause and fix **storefront**. Do not change anything in `backend`.
  The Deployment must have 1 ready replica.
checks:
  - name: Deployment `storefront` has 1 ready replica
    run: '[ "$(kubectl get deploy storefront -o jsonpath="{.status.readyReplicas}")" = 1 ]'
  - name: storefront is connected to inventory
    run: kubectl logs deploy/storefront | grep -q "connected to .*inventory\.backend"
solution: |
  kubectl logs deploy/storefront      # cannot reach http://inventory
  # "inventory" only resolves inside the same namespace (default). Add the namespace:
  kubectl set env deployment/storefront INVENTORY_URL=http://inventory.backend
  # or the full name: http://inventory.backend.svc.cluster.local
docs:
  - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#namespaces-of-services
