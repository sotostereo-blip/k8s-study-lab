id: cka-wl-015
title: Secret as a volume and a security context
domain: workloads-scheduling
difficulty: 2
minutes: 10
environment: single-node
task: |
  1. Create a Secret called `db-creds` with two keys: `username=admin` and
     `password=S3cret-pass`.
  2. Create a Pod called `secure-app` with image `busybox:1.36` that runs `sleep 3600`:
     - mount the Secret as files at `/etc/creds` (read-only)
     - run as user ID `1000`
     - the container must not allow privilege escalation
checks:
  - name: Secret `db-creds` has username=admin
    run: '[ "$(kubectl get secret db-creds -o jsonpath="{.data.username}" | base64 -d)" = admin ]'
  - name: Pod `secure-app` is running
    run: '[ "$(kubectl get pod secure-app -o jsonpath="{.status.phase}")" = Running ]'
  - name: /etc/creds/password contains the password
    run: '[ "$(kubectl exec secure-app -- cat /etc/creds/password)" = S3cret-pass ]'
  - name: The process runs as user 1000
    run: '[ "$(kubectl exec secure-app -- id -u)" = 1000 ]'
  - name: allowPrivilegeEscalation is false
    run: '[ "$(kubectl get pod secure-app -o jsonpath="{.spec.containers[0].securityContext.allowPrivilegeEscalation}")" = false ]'
solution: |
  kubectl create secret generic db-creds --from-literal=username=admin --from-literal=password=S3cret-pass
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: secure-app
  spec:
    securityContext:
      runAsUser: 1000
    volumes:
    - name: creds
      secret:
        secretName: db-creds
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
      - { name: creds, mountPath: /etc/creds, readOnly: true }
  YAML
docs:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
