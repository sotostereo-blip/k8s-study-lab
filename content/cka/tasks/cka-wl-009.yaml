id: cka-wl-009
title: DaemonSet on every node
domain: workloads-scheduling
difficulty: 2
minutes: 8
environment: two-node
setup: |
  kubectl taint node controlplane node-role.kubernetes.io/control-plane:NoSchedule
task: |
  Like in a kubeadm cluster, the node `controlplane` has the taint
  `node-role.kubernetes.io/control-plane:NoSchedule`.

  1. Create a namespace called `monitoring`.
  2. Create a DaemonSet called `node-agent` in `monitoring` with image `busybox:1.36`
     and command `sleep 3600`.

  The DaemonSet must run **one Pod on every node, including controlplane**.
  Do not remove the taint.
checks:
  - name: The taint on controlplane is still there
    run: kubectl get node controlplane -o json | jq -e '.spec.taints[] | select(.key=="node-role.kubernetes.io/control-plane")'
  - name: DaemonSet `node-agent` has 2 ready Pods
    run: '[ "$(kubectl -n monitoring get ds node-agent -o jsonpath="{.status.desiredNumberScheduled}/{.status.numberReady}")" = 2/2 ]'
  - name: A `node-agent` Pod runs on controlplane
    run: '[ -n "$(kubectl -n monitoring get pods --field-selector spec.nodeName=controlplane -o name)" ]'
solution: |
  kubectl create namespace monitoring
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: node-agent
    namespace: monitoring
  spec:
    selector:
      matchLabels: { app: node-agent }
    template:
      metadata:
        labels: { app: node-agent }
      spec:
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "3600"]
  YAML
  # tip: there is no "kubectl create daemonset"; start from a Deployment with $do and edit it
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
