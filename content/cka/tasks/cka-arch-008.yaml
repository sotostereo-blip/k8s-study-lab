id: cka-arch-008
title: Upgrade the control plane with kubeadm
domain: cluster-architecture
difficulty: 3
minutes: 20
environment: kubeadm
mock_exam: false   # needs the kubeadm environment
task: |
  The cluster runs Kubernetes **v1.36.4** and was installed with kubeadm.
  Upgrade the control plane node `controlplane` to **v1.37.2** (`ssh controlplane`):

  1. Upgrade the `kubeadm` package to `1.37.2-1.1` and apply the upgrade to the control plane.
  2. Drain the node `controlplane` (ignore DaemonSets) before you upgrade the kubelet.
  3. Upgrade the `kubelet` and `kubectl` packages to `1.37.2-1.1` and restart the kubelet.
  4. Uncordon the node.

  The node has an apt repository with the new packages (run `apt-get update` first).
  `node01` is not part of this task.
checks:
  - name: The API server runs v1.37.2
    run: '[ "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = v1.37.2 ]'
  - name: The kubelet on controlplane runs v1.37.2
    run: '[ "$(kubectl get node controlplane -o jsonpath={.status.nodeInfo.kubeletVersion})" = v1.37.2 ]'
  - name: kubectl on controlplane is v1.37.2
    run: ssh -n controlplane kubectl version --client -o json | jq -e '.clientVersion.gitVersion=="v1.37.2"' >/dev/null
  - name: controlplane is Ready and schedulable again (uncordoned)
    run: |
      [ "$(kubectl get node controlplane -o jsonpath='{.spec.unschedulable}')" != true ] &&
      kubectl get node controlplane --no-headers | grep -qw Ready
solution: |
  ssh controlplane
  apt-get update
  apt-cache madison kubeadm
  apt-mark unhold kubeadm
  apt-get install -y kubeadm=1.37.2-1.1
  apt-mark hold kubeadm
  kubeadm version
  kubeadm upgrade plan
  kubeadm upgrade apply v1.37.2        # answer y; this takes a few minutes
  exit

  kubectl drain controlplane --ignore-daemonsets --delete-emptydir-data

  ssh controlplane
  apt-mark unhold kubelet kubectl
  apt-get install -y kubelet=1.37.2-1.1 kubectl=1.37.2-1.1
  apt-mark hold kubelet kubectl
  systemctl daemon-reload
  systemctl restart kubelet
  exit

  kubectl uncordon controlplane        # if the API server is restarting, wait a moment and retry
  kubectl get nodes
auto_solution: |
  ssh -n controlplane 'apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq kubeadm=1.37.2-1.1 >/dev/null 2>&1 && kubeadm upgrade apply v1.37.2 -y >/dev/null 2>&1'
  kubectl drain controlplane --ignore-daemonsets --delete-emptydir-data --timeout=180s >/dev/null 2>&1
  ssh -n controlplane 'apt-get install -y -qq kubelet=1.37.2-1.1 kubectl=1.37.2-1.1 >/dev/null 2>&1 && systemctl daemon-reload && systemctl restart kubelet'
  for i in $(seq 60); do kubectl uncordon controlplane >/dev/null 2>&1 && break; sleep 3; done
docs:
  - https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
