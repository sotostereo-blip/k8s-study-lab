id: cka-ts-003
title: Pod stuck in Pending
domain: troubleshooting
difficulty: 2
minutes: 6
environment: single-node
setup: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: report
  spec:
    containers:
    - name: report
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "64"
          memory: 64Mi
  YAML
task: |
  The Pod `report` in `default` stays in `Pending`.

  Find out why and fix it so the Pod runs. Keep the name `report` and the image
  `busybox:1.36`. A CPU request of `100m` is enough for this Pod.
checks:
  - name: Pod `report` is running
    run: '[ "$(kubectl get pod report -o jsonpath="{.status.phase}")" = Running ]'
  - name: It still uses busybox:1.36
    run: '[ "$(kubectl get pod report -o jsonpath="{.spec.containers[0].image}")" = busybox:1.36 ]'
    guard: true   # already true before the task; must stay true
solution: |
  kubectl describe pod report | grep -A5 Events   # Insufficient cpu
  kubectl get pod report -o yaml > report.yaml
  # edit report.yaml: requests.cpu: "100m"  (resources of a running Pod cannot be edited in place)
  kubectl replace --force -f report.yaml
auto_solution: |
  kubectl get pod report -o yaml | sed 's/cpu: "64"/cpu: 100m/' | kubectl replace --force -f -
docs:
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
