id: cka-stor-001
title: PersistentVolumeClaim with dynamic provisioning
domain: storage
difficulty: 2
minutes: 8
environment: single-node
task: |
  1. Create a PersistentVolumeClaim called `data-pvc`:
     - size: `1Gi`
     - access mode: `ReadWriteOnce`
     - StorageClass: `local-path`
  2. Create a Pod called `writer` with image `busybox:1.36` that mounts the claim
     at `/data` and runs:
     `sh -c "echo hello > /data/hello.txt && sleep 3600"`
checks:
  - name: PVC `data-pvc` is Bound
    run: '[ "$(kubectl get pvc data-pvc -o jsonpath="{.status.phase}")" = Bound ]'
  - name: PVC asks for 1Gi with local-path
    run: '[ "$(kubectl get pvc data-pvc -o jsonpath="{.spec.resources.requests.storage}/{.spec.storageClassName}")" = 1Gi/local-path ]'
  - name: Pod `writer` uses data-pvc
    run: kubectl get pod writer -o json | jq -e '.spec.volumes[] | select(.persistentVolumeClaim.claimName=="data-pvc")'
  - name: /data/hello.txt contains "hello"
    run: '[ "$(kubectl exec writer -- cat /data/hello.txt)" = hello ]'
solution: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: data-pvc
  spec:
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    resources:
      requests:
        storage: 1Gi
  ---
  apiVersion: v1
  kind: Pod
  metadata:
    name: writer
  spec:
    containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo hello > /data/hello.txt && sleep 3600"]
      volumeMounts:
      - name: data
        mountPath: /data
    volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
  YAML
docs:
  - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
