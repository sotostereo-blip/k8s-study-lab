id: cka-net-006
title: Reach a Service in another namespace (DNS)
domain: services-networking
difficulty: 1
minutes: 6
environment: single-node
setup: |
  kubectl create namespace payments
  kubectl -n payments create deployment billing --image=nginx:1.27-alpine
  kubectl -n payments expose deployment billing --port=80
  kubectl -n payments rollout status deployment billing --timeout=180s
task: |
  The Service `billing` runs in the namespace `payments`.

  1. Write the **fully qualified DNS name** (FQDN) of this Service to the file
     `/root/billing-fqdn.txt` (only the name, for example `name.namespace.svc...`).
  2. Create a Pod called `dns-test` in `default` with image `busybox:1.36` that runs
     `sleep 3600`, and use it to open `http://<the FQDN>`.
checks:
  - name: /root/billing-fqdn.txt has the right FQDN
    run: '[ "$(tr -d "[:space:]" < /root/billing-fqdn.txt | sed "s/\.$//")" = billing.payments.svc.cluster.local ]'
  - name: Pod `dns-test` is running in default
    run: '[ "$(kubectl get pod dns-test -o jsonpath="{.status.phase}")" = Running ]'
  - name: dns-test reaches billing with that name
    run: kubectl exec dns-test -- wget -qO- -T 5 http://billing.payments.svc.cluster.local | grep -qi nginx
solution: |
  echo billing.payments.svc.cluster.local > /root/billing-fqdn.txt
  kubectl run dns-test --image=busybox:1.36 -- sleep 3600
  kubectl wait --for=condition=Ready pod/dns-test
  kubectl exec dns-test -- nslookup billing.payments.svc.cluster.local
  kubectl exec dns-test -- wget -qO- http://billing.payments.svc.cluster.local
  # format: <service>.<namespace>.svc.<cluster domain>
docs:
  - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
