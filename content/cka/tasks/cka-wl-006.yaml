id: cka-wl-006
title: Taints and tolerations
domain: workloads-scheduling
difficulty: 3
minutes: 8
environment: two-node
setup: |
  kubectl taint nodes node01 dedicated=gpu:NoSchedule
task: |
  The node `node01` has a taint: `dedicated=gpu:NoSchedule`.

  Create a Pod called `gpu-job` with image `busybox:1.36` that runs `sleep 3600`.
  The Pod must run **on node01**. Do not remove the taint.
checks:
  - name: The taint on node01 is still there
    run: kubectl get node node01 -o json | jq -e '.spec.taints[] | select(.key=="dedicated" and .value=="gpu" and .effect=="NoSchedule")'
  - name: Pod `gpu-job` tolerates the taint
    run: kubectl get pod gpu-job -o json | jq -e '.spec.tolerations[] | select(.key=="dedicated")'
  - name: Pod `gpu-job` is running on node01
    run: '[ "$(kubectl get pod gpu-job -o jsonpath="{.status.phase}/{.spec.nodeName}")" = Running/node01 ]'
solution: |
  kubectl run gpu-job --image=busybox:1.36 $do -- sleep 3600 > pod.yaml
  # add under spec:
  #   tolerations:
  #   - key: dedicated
  #     operator: Equal
  #     value: gpu
  #     effect: NoSchedule
  #   nodeSelector:
  #     kubernetes.io/hostname: node01
  kubectl apply -f pod.yaml
  # A toleration only ALLOWS the node; the nodeSelector makes the Pod go there.
docs:
  - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
