id: cka-arch-009
title: Join a worker node with kubeadm
domain: cluster-architecture
difficulty: 2
minutes: 8
environment: kubeadm
mock_exam: false   # needs the kubeadm environment
task: |
  The node `node01` (`ssh node01`) has containerd, kubeadm and the kubelet installed, but it is
  not part of the cluster yet.

  Join `node01` to the cluster as a **worker** node. Create the join command on `controlplane`
  (`ssh controlplane`).

  At the end `kubectl get nodes` must show `node01` as `Ready`.
checks:
  - name: node01 is in the cluster and Ready
    run: kubectl get node node01 --no-headers 2>/dev/null | grep -qw Ready
  - name: node01 is a worker (no control-plane role)
    run: |
      kubectl get node node01 >/dev/null 2>&1 &&
      [ -z "$(kubectl get node node01 -o jsonpath='{.metadata.labels.node-role\.kubernetes\.io/control-plane}' 2>/dev/null)" ] &&
      ! kubectl get node node01 -o jsonpath='{.metadata.labels}' | grep -q control-plane
solution: |
  ssh controlplane
  kubeadm token create --print-join-command
  exit
  ssh node01
  # paste the join command, for example:
  kubeadm join controlplane:6443 --token <token> --discovery-token-ca-cert-hash sha256:<hash>
  exit
  kubectl get nodes -w
auto_solution: |
  cmd=$(ssh -n controlplane kubeadm token create --print-join-command 2>/dev/null)
  ssh -n node01 "$cmd" >/dev/null 2>&1
  for i in $(seq 60); do kubectl get node node01 --no-headers 2>/dev/null | grep -qw Ready && break; sleep 3; done
docs:
  - https://kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-join/
  - https://kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-token/
