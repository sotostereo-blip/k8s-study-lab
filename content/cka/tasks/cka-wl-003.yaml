id: cka-wl-003
title: ConfigMap as environment variables
domain: workloads-scheduling
difficulty: 2
minutes: 7
environment: single-node
task: |
  1. Create a ConfigMap called `app-config` in the `default` namespace with two keys:
     - `MODE=production`
     - `LOG_LEVEL=debug`
  2. Create a Pod called `config-pod` with image `busybox:1.36` that runs `sleep 3600`.
     The Pod must load **all keys** of `app-config` as environment variables.
checks:
  - name: ConfigMap `app-config` has MODE=production
    run: '[ "$(kubectl get cm app-config -o jsonpath="{.data.MODE}")" = production ]'
  - name: ConfigMap `app-config` has LOG_LEVEL=debug
    run: '[ "$(kubectl get cm app-config -o jsonpath="{.data.LOG_LEVEL}")" = debug ]'
  - name: Pod `config-pod` is running
    run: '[ "$(kubectl get pod config-pod -o jsonpath="{.status.phase}")" = Running ]'
  - name: The Pod sees LOG_LEVEL=debug in its environment
    run: '[ "$(kubectl exec config-pod -- printenv LOG_LEVEL)" = debug ]'
solution: |
  kubectl create configmap app-config --from-literal=MODE=production --from-literal=LOG_LEVEL=debug
  kubectl run config-pod --image=busybox:1.36 $do -- sleep 3600 > pod.yaml
  # edit pod.yaml and add under the container:
  #   envFrom:
  #   - configMapRef:
  #       name: app-config
  kubectl apply -f pod.yaml
auto_solution: |
  kubectl create configmap app-config --from-literal=MODE=production --from-literal=LOG_LEVEL=debug
  kubectl run config-pod --image=busybox:1.36 --overrides='{"spec":{"containers":[{"name":"config-pod","image":"busybox:1.36","command":["sleep","3600"],"envFrom":[{"configMapRef":{"name":"app-config"}}]}]}}'
docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
