id: cka-stor-003
title: StorageClass with Retain policy
domain: storage
difficulty: 2
minutes: 10
environment: single-node
task: |
  1. Create a StorageClass called `retain-local`:
     - provisioner: `rancher.io/local-path`
     - reclaim policy: `Retain`
     - volume binding mode: `WaitForFirstConsumer`
  2. Create a PVC called `archive-pvc` (`200Mi`, `ReadWriteOnce`) that uses `retain-local`.
  3. Create a Pod called `archiver` with image `busybox:1.36` (`sleep 3600`) that mounts
     the PVC at `/archive`.
checks:
  - name: StorageClass `retain-local` is Retain + WaitForFirstConsumer
    run: '[ "$(kubectl get sc retain-local -o jsonpath="{.provisioner}/{.reclaimPolicy}/{.volumeBindingMode}")" = rancher.io/local-path/Retain/WaitForFirstConsumer ]'
  - name: PVC `archive-pvc` is Bound with retain-local
    run: '[ "$(kubectl get pvc archive-pvc -o jsonpath="{.status.phase}/{.spec.storageClassName}")" = Bound/retain-local ]'
  - name: Its PersistentVolume keeps the Retain policy
    run: '[ "$(kubectl get pv "$(kubectl get pvc archive-pvc -o jsonpath="{.spec.volumeName}")" -o jsonpath="{.spec.persistentVolumeReclaimPolicy}")" = Retain ]'
  - name: Pod `archiver` is running
    run: '[ "$(kubectl get pod archiver -o jsonpath="{.status.phase}")" = Running ]'
solution: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: storage.k8s.io/v1
  kind: StorageClass
  metadata:
    name: retain-local
  provisioner: rancher.io/local-path
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  ---
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: archive-pvc
  spec:
    accessModes: [ReadWriteOnce]
    storageClassName: retain-local
    resources:
      requests:
        storage: 200Mi
  ---
  apiVersion: v1
  kind: Pod
  metadata:
    name: archiver
  spec:
    containers:
    - name: archiver
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
      - { name: archive, mountPath: /archive }
    volumes:
    - name: archive
      persistentVolumeClaim:
        claimName: archive-pvc
  YAML
  # with WaitForFirstConsumer the PVC stays Pending until a Pod uses it
docs:
  - https://kubernetes.io/docs/concepts/storage/storage-classes/
