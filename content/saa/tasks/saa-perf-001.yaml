id: saa-perf-001
title: DynamoDB table with a global secondary index and TTL
domain: performing
difficulty: 2
minutes: 10
environment: aws
task: |
  A web app stores user sessions. Traffic is spiky and hard to predict. Create a DynamoDB table
  `saa-sessions`:

  - partition key `sessionId` (string),
  - **on-demand** capacity (billing mode `PAY_PER_REQUEST`), so it scales with no capacity planning,
  - a **global secondary index** named `userId-index` with partition key `userId` (string) and
    projection `ALL`, so the app can find all sessions of one user without a full table scan,
  - **Time to Live** on the attribute `expiresAt`, so old sessions are deleted automatically.
checks:
  - name: Table `saa-sessions` has partition key `sessionId` (S) and on-demand billing
    run: |
      out=$(aws dynamodb describe-table --table-name saa-sessions --output json 2>&1)
      echo "$out" | jq -e '.Table as $t | ($t.KeySchema[] | select(.KeyType == "HASH") | .AttributeName) == "sessionId"
        and ([$t.AttributeDefinitions[] | select(.AttributeName == "sessionId") | .AttributeType] == ["S"])
        and ($t.BillingModeSummary.BillingMode == "PAY_PER_REQUEST")' >/dev/null
  - name: GSI `userId-index` has partition key `userId` and projection ALL
    run: |
      out=$(aws dynamodb describe-table --table-name saa-sessions --output json 2>&1)
      echo "$out" | jq -e '[.Table.GlobalSecondaryIndexes[]? | select(.IndexName == "userId-index")
        | select((.KeySchema[] | select(.KeyType == "HASH") | .AttributeName) == "userId" and .Projection.ProjectionType == "ALL")] | length == 1' >/dev/null
  - name: TTL is enabled on `expiresAt`
    run: |
      out=$(aws dynamodb describe-time-to-live --table-name saa-sessions --output json 2>&1)
      echo "$out" | jq -e '.TimeToLiveDescription | (.TimeToLiveStatus == "ENABLED" or .TimeToLiveStatus == "ENABLING") and .AttributeName == "expiresAt"' >/dev/null
solution: |
  aws dynamodb create-table --table-name saa-sessions \
    --attribute-definitions AttributeName=sessionId,AttributeType=S AttributeName=userId,AttributeType=S \
    --key-schema AttributeName=sessionId,KeyType=HASH \
    --billing-mode PAY_PER_REQUEST \
    --global-secondary-indexes '[{"IndexName":"userId-index","KeySchema":[{"AttributeName":"userId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]'
  aws dynamodb wait table-exists --table-name saa-sessions
  aws dynamodb update-time-to-live --table-name saa-sessions \
    --time-to-live-specification Enabled=true,AttributeName=expiresAt

  # Try it: expiresAt is a Unix time in seconds (a Number)
  aws dynamodb put-item --table-name saa-sessions --item \
    '{"sessionId":{"S":"s-1"},"userId":{"S":"u-42"},"expiresAt":{"N":"'$(( $(date +%s) + 3600 ))'"}}'
  aws dynamodb query --table-name saa-sessions --index-name userId-index \
    --key-condition-expression 'userId = :u' --expression-attribute-values '{":u":{"S":"u-42"}}'
docs:
  - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
  - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html
