id: vault-secrets-001
title: Store app secrets in a KV version 2 engine
domain: secrets
difficulty: 1
minutes: 5
environment: vault
task: |
  The team wants its own place for application secrets.

  1. Enable a **KV version 2** secrets engine at the path `apps/`.
  2. Write the secret `apps/web/db` with two keys: `username=web` and `password=S3cure-web-2026`.
  3. Update the same secret so that `password` is `S3cure-web-2027` (keep `username`).
     KV v2 keeps both versions.
checks:
  - name: A kv engine version 2 is mounted at apps/
    run: |
      labvault secrets list -format=json | jq -e '."apps/".type == "kv" and ."apps/".options.version == "2"' >/dev/null
  - name: apps/web/db has username=web and password=S3cure-web-2027
    run: |
      labvault kv get -format=json apps/web/db | jq -e '.data.data == {"username":"web","password":"S3cure-web-2027"}' >/dev/null
  - name: Version 1 of apps/web/db still has the old password
    run: |
      labvault kv get -format=json -version=1 apps/web/db | jq -e '.data.data.password == "S3cure-web-2026"' >/dev/null
solution: |
  vault secrets enable -path=apps -version=2 kv      # or: vault secrets enable -path=apps kv-v2
  vault kv put apps/web/db username=web password=S3cure-web-2026
  vault kv patch apps/web/db password=S3cure-web-2027   # patch keeps the other keys
  # (vault kv put would replace ALL keys: put both again if you use it)
  vault kv get apps/web/db
  vault kv get -version=1 apps/web/db
  vault kv metadata get apps/web/db                   # all versions
docs:
  - https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
  - https://developer.hashicorp.com/vault/docs/commands/kv
