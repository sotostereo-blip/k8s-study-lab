id: vault-auth-001
title: Let a person log in with userpass
domain: auth
difficulty: 1
minutes: 6
environment: vault
setup: |
  printf 'path "secret/data/team/*" {\n  capabilities = ["read"]\n}\n' | labvault policy write team-read - >/dev/null
task: |
  A new team member, **alice**, needs to log in with a user name and a password.

  1. Enable the **userpass** auth method at its default path.
  2. Create the user `alice` with the password `Alice-2026!` and the policy `team-read`
     (the policy already exists).
  3. Test it: `vault login -method=userpass username=alice` (then log in again as root with
     `vault login` and the root token, or just keep working: the checks do not use your token).
checks:
  - name: userpass is enabled at userpass/
    run: labvault auth list -format=json | jq -e '."userpass/".type == "userpass"' >/dev/null
  - name: alice can log in with Alice-2026! and gets the policy team-read
    run: |
      out=$(vault login -no-store -format=json -method=userpass username=alice password='Alice-2026!' 2>/dev/null)
      echo "$out" | jq -e '.auth.policies | index("team-read") != null' >/dev/null
solution: |
  vault auth enable userpass
  vault write auth/userpass/users/alice password='Alice-2026!' token_policies=team-read
  vault login -method=userpass username=alice        # asks for the password
  vault token lookup                                 # policies: [default team-read]
auto_solution: |
  vault auth enable userpass
  vault write auth/userpass/users/alice password='Alice-2026!' token_policies=team-read
docs:
  - https://developer.hashicorp.com/vault/docs/auth/userpass
  - https://developer.hashicorp.com/vault/docs/commands/login
