id: vault-secrets-002
title: Dynamic PostgreSQL credentials
domain: secrets
difficulty: 3
minutes: 12
environment: vault
task: |
  Applications should get **short-lived database users** instead of one shared password.
  PostgreSQL runs at `postgres:5432`, database `shop`, admin user `postgres`, password `lab-root-pw`.

  1. Enable the **database** secrets engine at its default path.
  2. Configure a connection called `shop` (plugin `postgresql-database-plugin`) that allows
     the role `readonly`.
  3. Create the role `readonly`: each user it creates can **log in** and **SELECT on all tables
     in the schema public**. Default TTL **1 hour**, max TTL **24 hours**.
  4. Get a set of credentials with `vault read database/creds/readonly` and connect with psql.
checks:
  - name: The database engine has a connection shop for PostgreSQL that allows readonly
    run: |
      labvault read -format=json database/config/shop | jq -e '.data.plugin_name == "postgresql-database-plugin" and ((.data.allowed_roles | index("readonly")) != null or (.data.allowed_roles | index("*")) != null)' >/dev/null
  - name: The role readonly has default TTL 1h and max TTL 24h
    run: labvault read -format=json database/roles/readonly | jq -e '.data.default_ttl == 3600 and .data.max_ttl == 86400' >/dev/null
  - name: New credentials from database/creds/readonly can log in and SELECT, but not CREATE TABLE
    run: |
      set -e
      c=$(labvault read -format=json database/creds/readonly)
      u=$(echo "$c" | jq -r .data.username); p=$(echo "$c" | jq -r .data.password)
      psql -U postgres -qtAc 'CREATE TABLE IF NOT EXISTS lab_check_orders(id int)' >/dev/null
      PGUSER=$u PGPASSWORD=$p psql -qtAc 'SELECT count(*) FROM lab_check_orders' >/dev/null
      ! PGUSER=$u PGPASSWORD=$p psql -qtAc 'CREATE TABLE lab_check_x(id int)' >/dev/null 2>&1
solution: |
  vault secrets enable database
  vault write database/config/shop \
      plugin_name=postgresql-database-plugin \
      connection_url='postgresql://{{username}}:{{password}}@postgres:5432/shop?sslmode=disable' \
      username=postgres password=lab-root-pw allowed_roles=readonly
  vault write database/roles/readonly db_name=shop default_ttl=1h max_ttl=24h \
      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"{{name}}\";"
  vault read database/creds/readonly          # username, password, lease_id, lease_duration
  # Good practice: rotate the admin password so only Vault knows it:
  #   vault write -f database/rotate-root/shop
auto_solution: |
  vault secrets enable database
  vault write database/config/shop plugin_name=postgresql-database-plugin connection_url='postgresql://{{username}}:{{password}}@postgres:5432/shop?sslmode=disable' username=postgres password=lab-root-pw allowed_roles=readonly
  vault write database/roles/readonly db_name=shop default_ttl=1h max_ttl=24h creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"{{name}}\";"
docs:
  - https://developer.hashicorp.com/vault/docs/secrets/databases/postgresql
  - https://developer.hashicorp.com/vault/docs/secrets/databases
