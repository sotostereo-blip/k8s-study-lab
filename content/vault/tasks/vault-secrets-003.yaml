id: vault-secrets-003
title: Hand over a secret with response wrapping
domain: secrets
difficulty: 2
minutes: 6
environment: vault
setup: |
  labvault secrets enable -path=secret -version=2 kv >/dev/null
  until labvault kv put secret/partners/acme api_key=acme-7f3e91 >/dev/null 2>&1; do sleep 1; done
task: |
  A partner needs the secret `secret/partners/acme` (a KV version 2 engine is mounted at `secret/`), but you do not want to send the value
  itself in a chat message.

  1. Read the secret with **response wrapping** and a wrapping TTL of **15 minutes**.
  2. Save **only the wrapping token** in `/root/acme.wrap`. Do **not** unwrap it yourself:
     a wrapping token can be unwrapped only once, and the partner must be the first.
checks:
  - name: /root/acme.wrap is a wrapping token for secret/data/partners/acme
    run: |
      labvault write -format=json sys/wrapping/lookup token="$(cat /root/acme.wrap)" | jq -e '.data.creation_path == "secret/data/partners/acme"' >/dev/null
  - name: The wrapping TTL is 15 minutes
    run: labvault write -format=json sys/wrapping/lookup token="$(cat /root/acme.wrap)" | jq -e '.data.creation_ttl == 900' >/dev/null
solution: |
  vault kv get -wrap-ttl=15m secret/partners/acme       # shows wrapping_token, its TTL and the creation path
  vault kv get -wrap-ttl=15m -format=json secret/partners/acme | jq -r .wrap_info.token > /root/acme.wrap
  # (each command creates a NEW wrapping token; the file keeps the last one)
  vault write sys/wrapping/lookup token="$(cat /root/acme.wrap)"   # check it without using it
  # The partner runs: vault unwrap <token>   (a second unwrap fails: you would know of a leak)
auto_solution: |
  vault kv get -wrap-ttl=15m -format=json secret/partners/acme | jq -r .wrap_info.token > /root/acme.wrap
docs:
  - https://developer.hashicorp.com/vault/docs/concepts/response-wrapping
