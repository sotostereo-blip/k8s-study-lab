domain: secrets
questions:
  - id: vault-secrets-001
    difficulty: 1
    type: single
    question: "What is a secrets engine in Vault?"
    options:
      - id: a
        text: "A component enabled at a path that stores, creates or encrypts data"
      - id: b
        text: "A plugin that checks the identity of clients when they log in"
        why: "That describes an auth method. Secrets engines handle data after the client has a token."
      - id: c
        text: "The storage backend where Vault writes its encrypted data"
        why: "The storage backend (for example Integrated Storage) is only a place for encrypted data. Clients never talk to it."
      - id: d
        text: "A tool that copies secrets from Git repositories into Vault"
        why: "Vault has no such component. Secrets are written through the API, CLI or UI."
    answer: [a]
    explanation: |
      Secrets engines are mounted at paths, like a virtual file system. Some
      store data (KV), some create credentials on demand (database, AWS, PKI),
      and some give a service such as encryption (Transit). Requests to a path
      are sent to the engine mounted there.
    docs:
      - https://developer.hashicorp.com/vault/docs/secrets
    glossary: [vault-secrets-engine, vault-mount-path, vault-auth-method]

  - id: vault-secrets-002
    difficulty: 2
    type: single
    question: "Each instance of a web app must get its own PostgreSQL username and password, which should disappear automatically after a few hours. Which secrets engine fits?"
    options:
      - id: a
        text: "KV version 2"
        why: "KV stores static values that you write. It does not create database users or remove them."
      - id: b
        text: "Database"
      - id: c
        text: "Transit"
        why: "Transit encrypts and decrypts data. It does not create database credentials."
      - id: d
        text: "Cubbyhole"
        why: "Cubbyhole is private storage for one token. It cannot create users in PostgreSQL."
    answer: [b]
    explanation: |
      The database secrets engine connects to PostgreSQL (and many other
      databases) and creates a new user for each request to a role, such as
      `vault read database/creds/web`. Each user has a lease, and Vault drops the
      user when the lease ends or is revoked.
    docs:
      - https://developer.hashicorp.com/vault/docs/secrets/databases
      - https://developer.hashicorp.com/vault/docs/secrets/databases/postgresql
    glossary: [vault-secrets-engine, vault-dynamic-secret, vault-lease, vault-kv]

  - id: vault-secrets-003
    difficulty: 2
    type: single
    question: "Your team needs to issue short-lived TLS certificates for internal services without running a manual CA process. Which secrets engine fits?"
    options:
      - id: a
        text: "SSH"
        why: "The SSH engine signs SSH keys or creates one-time SSH passwords. It does not issue TLS certificates."
      - id: b
        text: "TOTP"
        why: "TOTP creates time-based one-time codes for multi-factor login, not certificates."
      - id: c
        text: "PKI"
      - id: d
        text: "Identity"
        why: "The identity engine manages entities and groups. It does not act as a certificate authority."
    answer: [c]
    explanation: |
      The PKI secrets engine acts as a certificate authority (or intermediate
      CA). Services ask for a certificate from a role and get it in seconds,
      with a short TTL, so certificates rotate often and revocation is rarely
      needed.
    docs:
      - https://developer.hashicorp.com/vault/docs/secrets/pki
    glossary: [vault-secrets-engine, pki, tls, certificate-authority]

  - id: vault-secrets-004
    difficulty: 1
    type: multiple
    question: "Which TWO are examples of dynamic secrets? (Select 2)"
    options:
      - id: a
        text: "AWS keys from `vault read aws/creds/deploy`"
      - id: b
        text: "An API key saved with `vault kv put secret/api key=abc`"
        why: "This is a static secret. It stays the same until someone writes a new value."
      - id: c
        text: "A MySQL user from `vault read database/creds/report`"
      - id: d
        text: "A value in the cubbyhole of your token"
        why: "Cubbyhole only stores what you write there. Vault does not create these values."
    answer: [a, c]
    explanation: |
      Dynamic secrets are created by Vault when a client asks, are unique to
      that client, and have a lease. Static secrets, like KV values, are written
      by a person or a tool and stay the same until they change them.
    docs:
      - https://developer.hashicorp.com/vault/docs/secrets/aws
      - https://developer.hashicorp.com/vault/docs/secrets/databases
    glossary: [vault-dynamic-secret, vault-static-secret, vault-kv, vault-cubbyhole]

  - id: vault-secrets-005
    difficulty: 2
    type: multiple
    question: "Which TWO are real benefits of short-lived dynamic secrets compared with one shared static database password? (Select 2)"
    options:
      - id: a
        text: "A leaked credential is only useful for a short time"
      - id: b
        text: "Each client gets its own credential, so the audit log shows who did what"
      - id: c
        text: "The database no longer needs any user accounts"
        why: "Dynamic secrets are still real database users. Vault creates and deletes them for you."
      - id: d
        text: "Apps can keep using the credential after Vault is gone"
        why: "Credentials still expire with their lease. Apps depend on Vault to get new ones."
    answer: [a, b]
    explanation: |
      Short TTLs limit the damage of a leak. Unique credentials per client make
      it easy to trace actions and to revoke one client without affecting the
      others. Vault also revokes them automatically, so no one has to remember
      to rotate a shared password.
    docs:
      - https://developer.hashicorp.com/vault/docs/secrets/databases
      - https://developer.hashicorp.com/vault/docs/concepts/lease
    glossary: [vault-dynamic-secret, vault-static-secret, vault-lease]

  - id: vault-secrets-006
    difficulty: 1
    type: single
    question: "Which command enables a KV version 2 secrets engine at the path `apps/`?"
    options:
      - id: a
        text: "`vault kv enable -path=apps -version=2`"
        why: "`vault kv` reads and writes data in a KV engine. Enabling engines is done with `vault secrets enable`."
      - id: b
        text: "`vault secrets enable -path=apps kv-v2`"
      - id: c
        text: "`vault auth enable -path=apps kv-v2`"
        why: "`vault auth enable` is for auth methods. KV is a secrets engine."
      - id: d
        text: "`vault write sys/mounts apps=kv-v2`"
        why: "The API needs the path in the URL (sys/mounts/apps) and the type in the body, not this form."
    answer: [b]
    explanation: |
      `vault secrets enable -path=apps kv-v2` (or `-version=2 kv`) mounts the
      engine at `apps/`. Without `-path`, the path is the engine type. In the UI
      you do the same under Secrets Engines > Enable new engine, and with the API
      you send a POST to `sys/mounts/apps` with `type=kv-v2`.
    docs:
      - https://developer.hashicorp.com/vault/docs/commands/secrets/enable
      - https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
    glossary: [vault-kv, vault-secrets-engine, vault-mount-path]

  - id: vault-secrets-007
    difficulty: 1
    type: single
    question: "A KV v2 engine is mounted at `secret/`. Which command prints only the `password` field of the secret `secret/app/db`?"
    options:
      - id: a
        text: "`vault kv get -field=password secret/app/db`"
      - id: b
        text: "`vault read secret/app/db password`"
        why: "`vault read` does not take field names like this, and on KV v2 the real API path includes data/."
      - id: c
        text: "`vault kv list -field=password secret/app/db`"
        why: "`vault kv list` lists key names under a path. It does not print secret values."
      - id: d
        text: "`vault kv get secret/data/app/db/password`"
        why: "`vault kv` adds data/ for you, and the field is not part of the path."
    answer: [a]
    explanation: |
      `vault kv get` reads the latest version, and `-field` prints one value,
      which is handy in scripts. Use `-version=N` for an older version and
      `-format=json` for JSON output. Since Vault 1.11 you can also write
      `vault kv get -mount=secret app/db`.
    docs:
      - https://developer.hashicorp.com/vault/docs/commands/kv/get
    glossary: [vault-kv]

  - id: vault-secrets-008
    difficulty: 2
    type: single
    question: "A script reads a KV v2 secret with the HTTP API. Which request is correct?"
    options:
      - id: a
        text: "`curl $VAULT_ADDR/v1/secret/app/db?token=$VAULT_TOKEN`"
        why: "Vault does not read tokens from the query string, and the KV v2 path needs data/."
      - id: b
        text: "`curl -H \"Authorization: Vault $VAULT_TOKEN\" $VAULT_ADDR/secret/data/app/db`"
        why: "The API paths start with /v1/. Without it, the request does not reach the API."
      - id: c
        text: "`curl -H \"X-Vault-Token: $VAULT_TOKEN\" $VAULT_ADDR/v1/secret/data/app/db`"
      - id: d
        text: "`curl -H \"X-Vault-Token: $VAULT_TOKEN\" $VAULT_ADDR/v2/secret/app/db`"
        why: "There is no /v2/ API prefix. The KV version shows in the data/ part of the path, not in the API version."
    answer: [c]
    explanation: |
      The HTTP API lives under `/v1/`. You send the token in the `X-Vault-Token`
      header (or as `Authorization: Bearer`). For KV v2, the read path is
      `/v1/<mount>/data/<path>`, and the values are in `.data.data` in the JSON
      response.
    docs:
      - https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
      - https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
    glossary: [vault-kv, vault-env, vault-token]

  - id: vault-secrets-009
    difficulty: 2
    type: single
    question: "You delete a KV v2 secret with `vault kv delete secret/app/db` and then notice it was a mistake. What is true?"
    options:
      - id: a
        text: "The data is gone forever and cannot come back"
        why: "That is what `vault kv destroy` does. `vault kv delete` is a soft delete in KV v2."
      - id: b
        text: "You can restore the version with `vault kv undelete`"
      - id: c
        text: "You must restore a full snapshot of the cluster"
        why: "A snapshot is not needed. KV v2 keeps the deleted version until it is destroyed."
      - id: d
        text: "The secret is only hidden from the UI, not from the CLI"
        why: "The deleted version is hidden from normal reads in the CLI, API and UI until you undelete it."
    answer: [b]
    explanation: |
      In KV v2, `vault kv delete` marks the latest version as deleted, and
      `vault kv undelete -versions=<n>` brings it back. `vault kv destroy`
      removes the data of a version for good, and `vault kv metadata delete`
      removes all versions and the metadata.
    docs:
      - https://developer.hashicorp.com/vault/docs/commands/kv/undelete
      - https://developer.hashicorp.com/vault/docs/commands/kv/delete
    glossary: [vault-kv]

  - id: vault-secrets-010
    difficulty: 2
    type: single
    question: "An operator must send a new app its first secret. The secret must not appear in chat logs, and the app must be able to tell if someone else read it first. What should the operator use?"
    options:
      - id: a
        text: "Response wrapping with a short wrap TTL"
      - id: b
        text: "A KV v2 secret with `max_versions=1`"
        why: "max_versions only limits how many versions are kept. It does not protect the secret in transit or detect a second reader."
      - id: c
        text: "A batch token with the secret in its metadata"
        why: "Token metadata is not meant for secrets, and anyone with the token could read it many times."
      - id: d
        text: "A Transit key that encrypts the chat message"
        why: "The app would still need a way to decrypt, and there is no single-use check."
    answer: [a]
    explanation: |
      With response wrapping (for example `vault kv get -wrap-ttl=5m
      secret/app/db`), Vault returns only a single-use wrapping token. The app
      runs `vault unwrap <token>` to get the data. If unwrapping fails because
      the token was already used, the app knows someone else saw it and can
      raise an alert.
    docs:
      - https://developer.hashicorp.com/vault/docs/concepts/response-wrapping
      - https://developer.hashicorp.com/vault/docs/commands/unwrap
    glossary: [vault-response-wrapping, vault-cubbyhole]

  - id: vault-secrets-011
    difficulty: 3
    type: single
    question: "Where does Vault keep the real response while it is wrapped?"
    options:
      - id: a
        text: "In the cubbyhole of the single-use wrapping token"
      - id: b
        text: "In a KV v2 engine at `sys/wrapping/`"
        why: "`sys/wrapping/` holds API endpoints such as unwrap and lookup. It is not a KV engine."
      - id: c
        text: "In the memory of the client that asked for it"
        why: "The client only receives the wrapping token. The data stays inside Vault until unwrapped."
      - id: d
        text: "In the audit log, encrypted with the root key"
        why: "Audit devices record requests with HMAC-hashed values. They are never used to store responses."
    answer: [a]
    explanation: |
      Vault creates a new token, puts the response in that token's cubbyhole,
      and returns the token. Only that token can read its cubbyhole, and the
      cubbyhole is deleted when the token is used or its TTL ends.
    docs:
      - https://developer.hashicorp.com/vault/docs/concepts/response-wrapping
      - https://developer.hashicorp.com/vault/docs/secrets/cubbyhole
    glossary: [vault-response-wrapping, vault-cubbyhole]

  - id: vault-secrets-012
    difficulty: 2
    type: single
    question: "True or false: disabling a secrets engine with `vault secrets disable` revokes all its secrets and deletes its data."
    options:
      - id: a
        text: "True"
      - id: b
        text: "False"
        why: "Disabling an engine is destructive. Vault revokes its leases and removes all data stored by that engine."
    answer: [a]
    explanation: |
      When you disable a secrets engine, Vault revokes all its leases and
      deletes all data in that mount. To keep the data and only change the path,
      use `vault secrets move` instead.
    docs:
      - https://developer.hashicorp.com/vault/docs/commands/secrets/disable
    glossary: [vault-secrets-engine, vault-lease]
