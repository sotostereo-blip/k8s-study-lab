id: cks-micro-004
title: Isolate a tenant namespace
domain: microservices
difficulty: 2
minutes: 10
environment: secure-node
setup: |
  kubectl create namespace team-blue
  kubectl create namespace team-green
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: blue-app, namespace: team-blue }
  spec:
    selector:
      matchLabels: { app: blue-app }
    template:
      metadata:
        labels: { app: blue-app }
      spec:
        containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 50m, memory: 32Mi }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: blue-client, namespace: team-blue, labels: { app: blue-client } }
  spec:
    containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: green-probe, namespace: team-green }
  spec:
    containers:
    - name: probe
      image: busybox:1.36
      command: ["sleep", "3600"]
  YAML
  kubectl -n team-blue expose deployment blue-app --port=80
  kubectl -n team-blue rollout status deployment blue-app --timeout=180s
  kubectl -n team-blue wait --for=condition=Ready pod/blue-client --timeout=180s
  kubectl -n team-green wait --for=condition=Ready pod/green-probe --timeout=180s
task: |
  The namespace `team-blue` belongs to one tenant. Other tenants (for example `team-green`)
  must not reach it, and it must not use all the cluster resources.

  1. Create a ResourceQuota called `blue-quota` in `team-blue` with these hard limits:
     - `pods`: `10`
     - `requests.cpu`: `2`
     - `requests.memory`: `2Gi`
  2. Create a NetworkPolicy called `blue-isolation` in `team-blue` so that all Pods in
     `team-blue` accept incoming traffic **only from Pods in `team-blue`**.

  Result: `blue-client` can reach the Service `blue-app`; `green-probe` (in `team-green`) cannot.
checks:
  - name: ResourceQuota blue-quota has pods=10, requests.cpu=2, requests.memory=2Gi
    run: |
      kubectl -n team-blue get resourcequota blue-quota -o json | jq -e '.spec.hard
        | (.pods == "10") and (.["requests.cpu"] == "2" or .["requests.cpu"] == "2000m")
        and (.["requests.memory"] == "2Gi")'
  - name: blue-isolation selects all Pods in team-blue and has policy type Ingress
    run: kubectl -n team-blue get netpol blue-isolation -o json | jq -e '(.spec.podSelector | length == 0) and (.spec.policyTypes | index("Ingress"))'
  - name: blue-client can reach blue-app
    run: kubectl -n team-blue exec blue-client -- wget -qO- -T 4 http://blue-app | grep -qi nginx
    guard: true
  - name: green-probe (team-green) cannot reach blue-app
    run: '! kubectl -n team-green exec green-probe -- wget -qO- -T 4 http://blue-app.team-blue'
solution: |
  kubectl -n team-blue create quota blue-quota --hard=pods=10,requests.cpu=2,requests.memory=2Gi
  cat <<'YAML' | kubectl apply -f -
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: blue-isolation
    namespace: team-blue
  spec:
    podSelector: {}
    policyTypes: [Ingress]
    ingress:
    - from:
      - podSelector: {}     # only Pods of this namespace
  YAML
  kubectl -n team-blue describe quota blue-quota
docs:
  - https://kubernetes.io/docs/concepts/security/multi-tenancy/
  - https://kubernetes.io/docs/concepts/policy/resource-quotas/
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
