id: cks-micro-003
title: Find the Pods that use a Secret
domain: microservices
difficulty: 2
minutes: 8
environment: secure-node
setup: |
  kubectl create namespace crm
  kubectl -n crm create secret generic ops-token --from-literal=token=ops-0001
  kubectl -n crm create secret generic web-config --from-literal=theme=dark
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata: { name: crm-sync, namespace: crm }
  spec:
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
      - name: TOKEN
        valueFrom: { secretKeyRef: { name: ops-token, key: token } }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: crm-backup, namespace: crm }
  spec:
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{ name: creds, mountPath: /creds }]
    volumes:
    - name: creds
      secret: { secretName: ops-token }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: crm-web, namespace: crm }
  spec:
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom: [{ secretRef: { name: web-config } }]
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: crm-cache, namespace: crm }
  spec:
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: crm-export, namespace: crm }
  spec:
    initContainers:
    - name: fetch
      image: busybox:1.36
      command: ["sh", "-c", "cat /all/token > /dev/null"]
      volumeMounts: [{ name: all, mountPath: /all }]
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
    volumes:
    - name: all
      projected:
        sources:
        - secret: { name: ops-token }
        - configMap: { name: kube-root-ca.crt }
  YAML
task: |
  The token in the Secret `ops-token` (namespace `crm`) was leaked and must be rotated.
  Before that, the team needs to know **which Pods use it**.

  Find **every** Pod in `crm` that uses the Secret `ops-token` in any way (environment
  variables, `envFrom`, `secret` volumes or `projected` volumes, in any container).

  Write the Pod names to `/root/crm-secret-users.txt`, **one name per line**.
checks:
  - name: /root/crm-secret-users.txt lists exactly the Pods that use ops-token
    run: |
      [ "$(grep -v '^\s*$' /root/crm-secret-users.txt | tr -d ' \t' | sort | tr '\n' ' ')" = "crm-backup crm-export crm-sync " ]
solution: |
  kubectl -n crm get pods -o json | jq -r '.items[]
    | select(
        ([.spec.volumes[]? | .secret.secretName, (.projected.sources[]?.secret.name)] | index("ops-token"))
        or ([(.spec.containers + (.spec.initContainers // []))[]
             | (.env[]?.valueFrom.secretKeyRef.name), (.envFrom[]?.secretRef.name)] | index("ops-token")))
    | .metadata.name' > /root/crm-secret-users.txt
  cat /root/crm-secret-users.txt
  # crm-sync (env), crm-backup (secret volume), crm-export (projected volume)
docs:
  - https://kubernetes.io/docs/concepts/configuration/secret/#using-a-secret
  - https://kubernetes.io/docs/concepts/storage/projected-volumes/
