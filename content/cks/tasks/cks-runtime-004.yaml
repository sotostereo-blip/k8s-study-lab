id: cks-runtime-004
title: Delete privileged and hostPath Pods
domain: runtime
difficulty: 2
minutes: 10
environment: secure-node
setup: |
  kubectl create namespace rt-alpha
  kubectl create namespace rt-beta
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata: { name: alpha-web, namespace: rt-alpha }
  spec:
    containers:
    - { name: web, image: nginx:1.27-alpine }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: alpha-debug, namespace: rt-alpha }
  spec:
    containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext: { privileged: true }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: alpha-logs, namespace: rt-alpha }
  spec:
    containers:
    - name: logs
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{ name: varlog, mountPath: /node-logs, readOnly: true }]
    volumes:
    - name: varlog
      hostPath: { path: /var/log }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: beta-api, namespace: rt-beta }
  spec:
    containers:
    - name: api
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext: { privileged: false, runAsUser: 1000 }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: beta-sidecar, namespace: rt-beta }
  spec:
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
    - name: helper
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext: { privileged: true }
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: beta-backup, namespace: rt-beta }
  spec:
    containers:
    - name: backup
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{ name: data, mountPath: /data }]
    volumes:
    - name: data
      emptyDir: {}
  ---
  apiVersion: v1
  kind: Pod
  metadata: { name: beta-scanner, namespace: rt-beta }
  spec:
    containers:
    - name: scan
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{ name: root, mountPath: /host }]
    volumes:
    - name: root
      hostPath: { path: / }
  YAML
task: |
  A security review says that some Pods in the namespaces `rt-alpha` and `rt-beta` can
  escape to the node.

  **Delete** every Pod in `rt-alpha` and `rt-beta` that:

  - has **any** container with `privileged: true`, **or**
  - mounts a **hostPath** volume.

  Do not delete the other Pods.
checks:
  - name: No privileged or hostPath Pods are left in rt-alpha and rt-beta
    run: |
      for ns in rt-alpha rt-beta; do
        kubectl -n $ns get pods -o json | jq -e '[.items[] | select(
          any(.spec.volumes[]?; .hostPath)
          or any((.spec.containers + (.spec.initContainers // []))[]; .securityContext.privileged == true))] | length == 0' >/dev/null || exit 1
      done
  - name: The safe Pods (alpha-web, beta-api, beta-backup) still exist
    run: kubectl -n rt-alpha get pod alpha-web && kubectl -n rt-beta get pod beta-api beta-backup
    guard: true
solution: |
  for ns in rt-alpha rt-beta; do
    kubectl -n $ns get pods -o json | jq -r '.items[] | select(
      any(.spec.volumes[]?; .hostPath)
      or any(.spec.containers[]; .securityContext.privileged == true)) | .metadata.name'
  done
  # alpha-debug alpha-logs (rt-alpha), beta-sidecar beta-scanner (rt-beta)
  kubectl -n rt-alpha delete pod alpha-debug alpha-logs
  kubectl -n rt-beta delete pod beta-sidecar beta-scanner
docs:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
  - https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
