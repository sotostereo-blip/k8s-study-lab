id: cks-micro-002
title: Secret as a read-only volume, then immutable
domain: microservices
difficulty: 2
minutes: 10
environment: secure-node
setup: |
  kubectl create namespace mailer
  kubectl -n mailer create secret generic smtp-creds \
    --from-literal=username=mailer-bot --from-literal=password=Ma1l-S3cret-42
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: mailer
    namespace: mailer
  spec:
    selector:
      matchLabels: { app: mailer }
    template:
      metadata:
        labels: { app: mailer }
      spec:
        containers:
        - name: mailer
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
          - name: SMTP_USER
            valueFrom: { secretKeyRef: { name: smtp-creds, key: username } }
          - name: SMTP_PASSWORD
            valueFrom: { secretKeyRef: { name: smtp-creds, key: password } }
  YAML
  kubectl -n mailer rollout status deployment mailer --timeout=180s
task: |
  The Deployment `mailer` in namespace `mailer` reads the Secret `smtp-creds` through
  **environment variables**. Env vars leak easily (crash dumps, `env` in logs, child processes).

  1. Change the Deployment so the Secret `smtp-creds` is mounted as a **volume** at
     `/etc/smtp` with `readOnly: true`. The container must **not** read any Secret through
     environment variables any more.
  2. Make the Secret `smtp-creds` **immutable**, without changing its data.

  The Deployment must keep running.
checks:
  - name: No env or envFrom in the container reads a Secret
    run: |
      kubectl -n mailer get deploy mailer -o json | jq -e '.spec.template.spec.containers[0]
        | ([.env[]?.valueFrom.secretKeyRef | select(.)] | length == 0) and ([.envFrom[]?.secretRef | select(.)] | length == 0)'
  - name: Secret smtp-creds is mounted read-only at /etc/smtp
    run: |
      kubectl -n mailer get deploy mailer -o json | jq -e '.spec.template.spec as $s
        | [$s.volumes[]? | select(.secret.secretName == "smtp-creds") | .name] as $v
        | [$s.containers[0].volumeMounts[]? | select(.mountPath == "/etc/smtp" and .readOnly == true and (.name as $n | $v | index($n)))] | length > 0'
  - name: The running Pod reads the password from /etc/smtp/password
    run: '[ "$(kubectl -n mailer exec deploy/mailer -- cat /etc/smtp/password)" = Ma1l-S3cret-42 ]'
  - name: Secret smtp-creds is immutable
    run: '[ "$(kubectl -n mailer get secret smtp-creds -o jsonpath="{.immutable}")" = true ]'
  - name: The Secret data did not change
    run: '[ "$(kubectl -n mailer get secret smtp-creds -o jsonpath="{.data.username}" | base64 -d)" = mailer-bot ]'
    guard: true
solution: |
  kubectl -n mailer edit deployment mailer
  # remove the env: block and add
  #   containers:
  #   - name: mailer
  #     volumeMounts:
  #     - name: smtp
  #       mountPath: /etc/smtp
  #       readOnly: true
  #   volumes:
  #   - name: smtp
  #     secret:
  #       secretName: smtp-creds
  kubectl -n mailer rollout status deployment mailer
  kubectl -n mailer patch secret smtp-creds -p '{"immutable": true}'
  kubectl -n mailer exec deploy/mailer -- ls /etc/smtp
auto_solution: |
  kubectl -n mailer patch deployment mailer --type=json -p '[
    {"op":"remove","path":"/spec/template/spec/containers/0/env"},
    {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts","value":[{"name":"smtp","mountPath":"/etc/smtp","readOnly":true}]},
    {"op":"add","path":"/spec/template/spec/volumes","value":[{"name":"smtp","secret":{"secretName":"smtp-creds"}}]}]'
  kubectl -n mailer rollout status deployment mailer --timeout=120s
  kubectl -n mailer patch secret smtp-creds -p '{"immutable": true}'
docs:
  - https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-files-from-a-pod
  - https://kubernetes.io/docs/concepts/configuration/secret/#secret-immutable
  - https://kubernetes.io/docs/concepts/security/secrets-good-practices/
