id: cks-supply-003
title: Allow only one registry with a ValidatingAdmissionPolicy
domain: supply-chain
difficulty: 3
minutes: 15
environment: secure-node
setup: |
  kubectl create namespace secure-registry
  kubectl label namespace secure-registry registry-policy=strict
task: |
  In namespaces with the label `registry-policy=strict` (today: `secure-registry`), Pods may
  only use images from the registry **`registry.k8s.io/`**.

  1. Create a `ValidatingAdmissionPolicy` called `allowed-registries` that checks `CREATE` and
     `UPDATE` of `pods` and fails when **any** container or init container uses an image that
     does not start with `registry.k8s.io/`. Use a CEL expression.
  2. Create a `ValidatingAdmissionPolicyBinding` called `allowed-registries-binding` with the
     action `Deny` that applies the policy **only** to namespaces with the label
     `registry-policy=strict`.

  Pods in other namespaces must not be affected.

  Test: `kubectl -n secure-registry run t --image=nginx:1.27-alpine --dry-run=server`
checks:
  - name: The binding uses action Deny and a namespaceSelector for registry-policy=strict
    run: |
      kubectl get validatingadmissionpolicybinding allowed-registries-binding -o json | jq -e '
        .spec.policyName == "allowed-registries" and (.spec.validationActions | index("Deny"))
        and .spec.matchResources.namespaceSelector.matchLabels["registry-policy"] == "strict"'
  - name: A Pod with nginx:1.27-alpine is denied in secure-registry
    run: |
      out=$(kubectl -n secure-registry run vap-test --image=nginx:1.27-alpine --dry-run=server 2>&1); rc=$?
      [ $rc -ne 0 ] && echo "$out" | grep -q allowed-registries
  - name: A Pod with a bad init container image is denied in secure-registry
    run: |
      out=$(kubectl -n secure-registry run vap-test --image=registry.k8s.io/pause:3.10 --dry-run=server \
        --overrides='{"spec":{"initContainers":[{"name":"init","image":"busybox:1.36","command":["true"]}]}}' 2>&1); rc=$?
      [ $rc -ne 0 ] && echo "$out" | grep -q allowed-registries
  - name: A Pod with registry.k8s.io/pause:3.10 is allowed in secure-registry
    run: kubectl -n secure-registry run vap-test --image=registry.k8s.io/pause:3.10 --dry-run=server
    guard: true
  - name: Pods in other namespaces are not affected
    run: kubectl -n default run vap-test --image=nginx:1.27-alpine --dry-run=server
    guard: true
solution: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicy
  metadata:
    name: allowed-registries
  spec:
    failurePolicy: Fail
    matchConstraints:
      resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    validations:
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith('registry.k8s.io/')) &&
        (!has(object.spec.initContainers) ||
         object.spec.initContainers.all(c, c.image.startsWith('registry.k8s.io/')))
      message: "only images from registry.k8s.io/ are allowed"
  ---
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicyBinding
  metadata:
    name: allowed-registries-binding
  spec:
    policyName: allowed-registries
    validationActions: [Deny]
    matchResources:
      namespaceSelector:
        matchLabels:
          registry-policy: strict
  YAML
  kubectl -n secure-registry run t --image=nginx:1.27-alpine --dry-run=server   # denied
docs:
  - https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
  - https://kubernetes.io/docs/concepts/security/security-checklist/
