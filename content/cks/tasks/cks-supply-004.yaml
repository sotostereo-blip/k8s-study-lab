id: cks-supply-004
title: Fix a manifest until kube-linter passes
domain: supply-chain
difficulty: 2
minutes: 12
environment: secure-node
setup: |
  kubectl create namespace lint-zone
  mkdir -p /root/lint
  cat > /root/lint/inventory.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: inventory
    namespace: lint-zone
  spec:
    replicas: 1
    selector:
      matchLabels: { app: inventory }
    template:
      metadata:
        labels: { app: inventory }
      spec:
        containers:
        - name: inventory
          image: busybox:latest
          command: ["sh", "-c", "while true; do echo counting; sleep 30; done"]
          securityContext:
            privileged: true
  YAML
  cat > /root/lint/checks.txt <<'TXT'
  kube-linter lint --do-not-auto-add-defaults \
    --include latest-tag,privileged-container,privilege-escalation-container,run-as-non-root,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements \
    /root/lint/inventory.yaml
  TXT
task: |
  The file `/root/lint/inventory.yaml` has a Deployment `inventory` that the team wants to
  deploy to the namespace `lint-zone`. Before that, it must pass a **static analysis** with
  `kube-linter`. The exact command is in `/root/lint/checks.txt`:

  ```
  bash /root/lint/checks.txt
  ```

  1. Fix `/root/lint/inventory.yaml` until this command finds **no errors**.
     Use the image `busybox:1.36` and keep the same command.
  2. Apply the file. The Deployment `inventory` must be running with 1 ready replica.
checks:
  - name: kube-linter finds no errors in /root/lint/inventory.yaml
    run: bash /root/lint/checks.txt
  - name: Deployment inventory in lint-zone has 1 ready replica with busybox:1.36
    run: |
      [ "$(kubectl -n lint-zone get deploy inventory -o jsonpath='{.status.readyReplicas}')" = 1 ] &&
      [ "$(kubectl -n lint-zone get deploy inventory -o jsonpath='{.spec.template.spec.containers[0].image}')" = busybox:1.36 ]
  - name: The live Deployment also passes the same kube-linter checks
    run: |
      f=$(mktemp -d)/live.yaml
      kubectl -n lint-zone get deploy inventory -o yaml > $f &&
      sed "s#/root/lint/inventory.yaml#$f#" /root/lint/checks.txt | bash
  - name: The kube-linter command file was not changed
    run: grep -q 'latest-tag,privileged-container,privilege-escalation-container,run-as-non-root,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements' /root/lint/checks.txt
    guard: true
solution: |
  bash /root/lint/checks.txt        # read every error and its "remediation"
  vim /root/lint/inventory.yaml
  # the container should look like this:
  #   - name: inventory
  #     image: busybox:1.36
  #     command: ["sh", "-c", "while true; do echo counting; sleep 30; done"]
  #     resources:
  #       requests: { cpu: 10m, memory: 16Mi }
  #       limits:   { memory: 32Mi }
  #     securityContext:
  #       runAsNonRoot: true
  #       runAsUser: 1000
  #       allowPrivilegeEscalation: false
  #       readOnlyRootFilesystem: true
  #       capabilities: { drop: ["ALL"] }
  bash /root/lint/checks.txt        # No lint errors found!
  kubectl apply -f /root/lint/inventory.yaml
  kubectl -n lint-zone rollout status deployment inventory
auto_solution: |
  cat > /root/lint/inventory.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: inventory
    namespace: lint-zone
  spec:
    replicas: 1
    selector:
      matchLabels: { app: inventory }
    template:
      metadata:
        labels: { app: inventory }
      spec:
        containers:
        - name: inventory
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo counting; sleep 30; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  YAML
  kubectl apply -f /root/lint/inventory.yaml
  kubectl -n lint-zone rollout status deployment inventory --timeout=120s
docs:
  - https://kubernetes.io/docs/concepts/security/application-security-checklist/
  - https://docs.kubelinter.io/
