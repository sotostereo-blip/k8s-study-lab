# One-node k3s cluster for CKS labs: the API server writes an audit log that the
# terminal can read at /var/log/kubernetes/audit/audit.log.
services:
  server:
    image: rancher/k3s:v1.37.2-k3s1
    hostname: controlplane
    command:
      - server
      - --disable=traefik
      - --tls-san=server
      - --node-name=controlplane
      - --kube-apiserver-arg=audit-policy-file=/etc/kubernetes/audit-policy.yaml
      - --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit/audit.log
      - --kube-apiserver-arg=audit-log-maxsize=50
      - --kube-apiserver-arg=audit-log-maxbackup=2
    privileged: true
    tmpfs: [/run, /var/run]
    environment:
      K3S_TOKEN: study-lab
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    configs:
      - source: audit-policy
        target: /etc/kubernetes/audit-policy.yaml
    volumes: [kubeconfig:/output, audit:/var/log/kubernetes/audit]
  toolbox:
    build: ../../toolbox
    image: k8s-study-lab/toolbox:3
    depends_on: [server]
    ports: ["127.0.0.1:${TERMINAL_PORT:-7681}:7681"]
    volumes: [kubeconfig:/output:ro, audit:/var/log/kubernetes/audit:ro]
configs:
  audit-policy:
    content: |
      apiVersion: audit.k8s.io/v1
      kind: Policy
      omitStages: [RequestReceived]
      rules:
        # no noise from the control plane talking to itself
        - level: None
          users: ["system:apiserver", "system:kube-scheduler", "system:kube-controller-manager", "system:k3s-controller"]
        - level: None
          userGroups: ["system:nodes", "system:serviceaccounts:kube-system"]
        # who opened a shell / attached / port-forwarded into a Pod (kubectl exec is a "get" over WebSocket)
        - level: Metadata
          resources: [{ group: "", resources: ["pods/exec", "pods/attach", "pods/portforward"] }]
        # who READ a Secret
        - level: Metadata
          verbs: ["get", "list", "watch"]
          resources: [{ group: "", resources: ["secrets"] }]
        - level: None
          verbs: ["get", "list", "watch"]
        # who touched Secrets, and when (never log their content)
        - level: Metadata
          resources: [{ group: "", resources: ["secrets"] }]
        # full request body for changes to Pods and RBAC
        - level: Request
          verbs: ["create", "update", "patch", "delete"]
          resources:
            - { group: "", resources: ["pods"] }
            - { group: "rbac.authorization.k8s.io" }
        - level: Metadata
volumes:
  kubeconfig:
  audit:
