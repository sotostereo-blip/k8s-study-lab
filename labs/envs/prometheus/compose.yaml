# Prometheus lab (no Kubernetes): Prometheus, Alertmanager, node-exporter, Pushgateway, Grafana,
# three copies of a demo app with metrics, an Alertmanager webhook receiver and a terminal.
# The config files live in the shared `lab` volume, seeded by the toolbox and edited at /lab.
x-app: &app
  build: ../../prometheus-apps
  image: k8s-study-lab/prometheus-apps:1
  restart: unless-stopped

services:
  toolbox:
    build: ../../toolbox-prometheus
    image: k8s-study-lab/toolbox-prometheus:1
    init: true
    volumes: ["lab:/lab"]
    ports: ["127.0.0.1:${TERMINAL_PORT:-7681}:7681"]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/lab/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=12h
      - --web.enable-lifecycle
    volumes: ["lab:/lab:ro"]
    depends_on: { toolbox: { condition: service_healthy } }

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      - --config.file=/lab/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes: ["lab:/lab:ro"]
    depends_on: { toolbox: { condition: service_healthy } }

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command: ["--collector.textfile.directory=/lab/textfile"]
    volumes: ["lab:/lab:ro"]
    depends_on: { toolbox: { condition: service_healthy } }

  pushgateway:
    image: prom/pushgateway:v1.11.2
    restart: unless-stopped

  # Grafana: http://grafana:3000 from the terminal, user admin / password admin.
  # Provisioning files are read from /lab/grafana/provisioning (edit them in the terminal).
  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /lab/grafana/provisioning
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
    volumes: ["lab:/lab:ro"]
    depends_on: { toolbox: { condition: service_healthy } }

  shop:
    <<: *app
    environment: { APP_NAME: shop }

  payments:
    <<: *app
    environment: { APP_NAME: payments }

  inventory:
    <<: *app
    environment: { APP_NAME: inventory }

  webhook:
    <<: *app
    command: ["python", "/app/webhook.py"]

volumes:
  lab:
