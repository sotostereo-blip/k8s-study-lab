# The whole app: `docker compose up -d --build`, then open http://localhost:5173
# Change the host ports with APP_PORT / API_PORT in .env if 5173 or 8000 are taken.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["${API_PORT:-8000}:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/app:/app/app      # live reload while developing
      - ./content:/content:ro       # study content (questions, glossary)
      - ./data:/data                # your progress (SQLite), not committed
      - ./labs:/labs:ro             # hands-on lab environments (built and started by the backend)
      - /var/run/docker.sock:/var/run/docker.sock   # lets the backend start/stop labs on your Docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${APP_PORT:-5173}:5173"]
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend: { condition: service_healthy }
