name: CI
on: [push, pull_request]
jobs:
  content-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python scripts/validate_content.py
      - run: python scripts/check_facts.py --warn-only   # warns when exam facts are over 6 months old
      - run: cd backend && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm install && npm run build
  docker-install:   # the install path in INSTALL.md: docker compose up, then the health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose up -d --build
      - run: |
          for i in $(seq 1 45); do curl -sf http://localhost:5173/api/health && exit 0; sleep 2; done
          docker compose ps; docker compose logs; exit 1
